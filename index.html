.keypad-resize:before,.keypad-resize:after{

.keypad-resize:before{width:13px;height:13px}
.keypad-resize:after{width:7px;height:7px;right:10px;bottom:10px}

.product-keypad-resize{position:absolute;right:2px;bottom:2px;width:28px;height:28px;touch-action:none;cursor:nwse-resize}.product-keypad-resize:before,.product-keypad-resize:after{content:"";position:absolute;right:6px;bottom:6px;border-radius:2px;border-right:2px solid #aaa19a;border-bottom:2px solid #aaa19a}.product-keypad-resize:before{width:13px;height:13px}.product-keypad-resize:after{width:7px;height:7px;right:10px;bottom:10px}

</style>

<script>
const KEY="gencho-v03-data",ROOM_NAMES=["玄関","廊下","洗面所","トイレ","洋室1","洋室2","洋室3","和室","キッチン","リビング","LDK","収納","WIC","SC","パントリー","階段","2階廊下"],CATS=["天","ハリ","壁","下り天","AW","CB","腰上","腰下"],$=s=>document.querySelector(s);
let state=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{siteName:"",rooms:[]}}catch{return{siteName:"",rooms:[]}}})(),activeRoom=state.rooms[0]?.id||null,calcMode="room";
let activeMeasureInput=null,activeMeasureModel=null,activeMeasureSection=null,activeMeasureList=null,activeMeasureRow=null,activeRepeatButton=null,activeRepeatSection=null,keypadMode="measure";

const KEYPAD_PREF_KEY="gencho-keypad-layout-v1";
let keypadLayout=(()=>{try{return JSON.parse(localStorage.getItem(KEYPAD_PREF_KEY))||null}catch{return null}})();

const PRODUCT_KEYPAD_PREF_KEY="gencho-product-keypad-layout-v1";
let productKeypadLayout=(()=>{try{return JSON.parse(localStorage.getItem(PRODUCT_KEYPAD_PREF_KEY))||null}catch{return null}})();
let activeProductButton=null,activeProductSection=null,productUpper=true;
function applyProductKeypadLayout(){const kp=$("#productKeypad");if(!kp)return;if(productKeypadLayout){const maxW=Math.max(380,window.innerWidth-16),w=clamp(+productKeypadLayout.width||680,380,Math.min(860,maxW));kp.style.width=w+"px";kp.style.transform="none";kp.style.bottom="auto";kp.style.setProperty("--pk-h",clamp(Math.round(42*(w/680)),36,58)+"px");kp.style.setProperty("--pk-font",clamp(Math.round(18*(w/680)),15,25)+"px");requestAnimationFrame(()=>{const r=kp.getBoundingClientRect();kp.style.left=clamp(+productKeypadLayout.left||8,8,Math.max(8,window.innerWidth-r.width-8))+"px";kp.style.top=clamp(+productKeypadLayout.top||80,8,Math.max(8,window.innerHeight-r.height-8))+"px"})}}
function saveProductKeypadLayout(){const kp=$("#productKeypad");if(!kp)return;const r=kp.getBoundingClientRect();productKeypadLayout={left:r.left,top:r.top,width:r.width};localStorage.setItem(PRODUCT_KEYPAD_PREF_KEY,JSON.stringify(productKeypadLayout))}
function setProductKeypadFreePosition(){const kp=$("#productKeypad");if(!kp)return null;const r=kp.getBoundingClientRect();kp.style.transform="none";kp.style.bottom="auto";kp.style.left=r.left+"px";kp.style.top=r.top+"px";return r}
function renderProductLetters(){[["productRowQwerty","QWERTYUIOP"],["productRowHome","ASDFGHJKL"],["productRowBottom","ZXCVBNM"]].forEach(([id,letters])=>{const row=document.getElementById(id);row.innerHTML="";[...letters].forEach(ch=>{const b=document.createElement("button");b.type="button";const shown=productUpper?ch:ch.toLowerCase();b.textContent=shown;b.dataset.pkey=shown;row.appendChild(b)})});$("#productShift")?.classList.toggle("active",productUpper)}
function syncProductButton(){if(!activeProductButton||!activeProductSection)return;activeProductButton.textContent=activeProductSection.product||"品番";activeProductButton.classList.toggle("empty",!activeProductSection.product);save();live()}
function showProductKeypad(btn,sec){hideMeasureKeypad();activeProductButton=btn;activeProductSection=sec;document.querySelectorAll(".product-button.active-input").forEach(el=>el.classList.remove("active-input"));btn.classList.add("active-input");productUpper=true;renderProductLetters();const kp=$("#productKeypad");kp.classList.add("show");kp.setAttribute("aria-hidden","false");applyProductKeypadLayout()}
function hideProductKeypad(){const kp=$("#productKeypad");if(kp){kp.classList.remove("show");kp.setAttribute("aria-hidden","true")}activeProductButton?.classList.remove("active-input")}
function productKeyPress(key){if(!activeProductSection)return;if(key==="shift"){productUpper=!productUpper;renderProductLetters();return}if(key==="done"){hideProductKeypad();return}if(key==="back"){activeProductSection.product=String(activeProductSection.product||"").slice(0,-1);syncProductButton();return}if(/^[A-Za-z0-9-]$/.test(key)){activeProductSection.product=(activeProductSection.product||"")+key;syncProductButton()}}


function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function applyKeypadLayout(){
  const kp=$("#measureKeypad"); if(!kp)return;
  if(keypadLayout){
    const maxW=Math.max(270,window.innerWidth-16);
    const w=clamp(+keypadLayout.width||420,270,Math.min(540,maxW));
    kp.style.width=w+"px";
    kp.style.transform="none";
    kp.style.bottom="auto";
    const keyH=clamp(Math.round(46*(w/420)),40,60);
    const keyFont=clamp(Math.round(20*(w/420)),17,25);
    kp.style.setProperty("--key-h",keyH+"px");
    kp.style.setProperty("--key-font",keyFont+"px");
    requestAnimationFrame(()=>{
      const rect=kp.getBoundingClientRect();
      const left=clamp(+keypadLayout.left||8,8,Math.max(8,window.innerWidth-rect.width-8));
      const top=clamp(+keypadLayout.top||80,8,Math.max(8,window.innerHeight-rect.height-8));
      kp.style.left=left+"px";kp.style.top=top+"px";
    });
  }
}
function saveKeypadLayout(){
  const kp=$("#measureKeypad"); if(!kp)return;
  const rect=kp.getBoundingClientRect();
  keypadLayout={left:rect.left,top:rect.top,width:rect.width};
  localStorage.setItem(KEYPAD_PREF_KEY,JSON.stringify(keypadLayout));
}
function setKeypadFreePosition(){
  const kp=$("#measureKeypad"); if(!kp)return null;
  const rect=kp.getBoundingClientRect();
  kp.style.transform="none";kp.style.bottom="auto";
  kp.style.left=rect.left+"px";kp.style.top=rect.top+"px";
  return rect;
}
function keepKeypadOnScreen(){
  const kp=$("#measureKeypad"); if(!kp||!kp.classList.contains("show"))return;
  const rect=kp.getBoundingClientRect();
  kp.style.transform="none";kp.style.bottom="auto";
  kp.style.left=clamp(rect.left,8,Math.max(8,window.innerWidth-rect.width-8))+"px";
  kp.style.top=clamp(rect.top,8,Math.max(8,window.innerHeight-rect.height-8))+"px";
}

const newSec=name=>({id:uid(),name,product:"",repeat:"",measures:[blank()]});
const newRoom=name=>({id:uid(),name,sections:[]});


function showMeasureKeypad(inp,model,sec,list,row){hideProductKeypad();
  keypadMode="measure";
  activeRepeatButton=null;activeRepeatSection=null;
  document.querySelectorAll(".measure-row.active-row").forEach(el=>el.classList.remove("active-row"));
  document.querySelectorAll(".measure-input.active-input").forEach(el=>el.classList.remove("active-input"));
  activeMeasureInput=inp;
  activeMeasureModel=model;
  activeMeasureSection=sec;
  activeMeasureList=list;
  activeMeasureRow=row; row?.classList.add("active-row"); inp?.classList.add("active-input");
  $("#keypadLabel").textContent="寸法入力"; const kp=$("#measureKeypad");
  if(kp){kp.classList.add("show");kp.setAttribute("aria-hidden","false");applyKeypadLayout()}
}
function showRepeatKeypad(btn,sec){hideProductKeypad();

  const kp=$("#measureKeypad");

}
function hideMeasureKeypad(){
  const kp=$("#measureKeypad");
  if(kp){kp.classList.remove("show");kp.setAttribute("aria-hidden","true")}
}
function syncActiveMeasure(){
  if(!activeMeasureInput||!activeMeasureModel)return;
  activeMeasureModel.value=activeMeasureInput.value
    .replace(/[＊※]/g,"*")
    .replace(/[×xX]/g,"-")
    .replace(/[^\d.*-]/g,"");
  activeMeasureInput.value=activeMeasureModel.value;
  activeMeasureInput.textContent=activeMeasureModel.value || activeMeasureInput.dataset.placeholder || "";
  activeMeasureInput.classList.toggle("empty",!activeMeasureModel.value);
  save(); live();
}
function moveToNextMeasure(){
  if(!activeMeasureSection||!activeMeasureModel||!activeMeasureList)return;
  if(!activeMeasureModel.value.trim())return;

  let currentIndex=activeMeasureSection.measures.findIndex(x=>x.id===activeMeasureModel.id);
  let next=activeMeasureSection.measures[currentIndex+1];

  if(!next){
    next=blank();
    activeMeasureSection.measures.push(next);
    save();
    let nextRow=addMeasureRowGlobal(activeMeasureSection,next,currentIndex+1,activeMeasureList);
    activeMeasureList.appendChild(nextRow);
  }

  const inputs=activeMeasureList.querySelectorAll(".measure-input");
  const nextInput=inputs[currentIndex+1];
  const nextRow=nextInput?.closest(".measure-row");

      kp.style.left=sl+"px";kp.style.top=clamp(st,8,Math.max(8,window.innerHeight-kp.offsetHeight-8))+"px";
    };
    const up=ev=>{
      resize.releasePointerCapture?.(e.pointerId);
      resize.removeEventListener("pointermove",move);resize.removeEventListener("pointerup",up);resize.removeEventListener("pointercancel",up);
      saveKeypadLayout();
    };
    resize.addEventListener("pointermove",move);resize.addEventListener("pointerup",up);resize.addEventListener("pointercancel",up);
  });

  window.addEventListener("resize",()=>{keepKeypadOnScreen();if(keypadLayout)saveKeypadLayout()});
})();

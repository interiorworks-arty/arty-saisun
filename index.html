<style>
:root{--bg:#f5f3f0;--paper:#fff;--ink:#272522;--muted:#aaa39d;--line:#ddd7d2;--accent:#665f59;--soft:#eeeae6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(245,243,240,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 14px 11px}

.add-tab{font-size:18px;padding:6px 13px}
.room-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.room-title h2{margin:0;font-size:20px}.room-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.small-btn{border:0;background:transparent;color:#8b8179;padding:8px}.small-btn.img{background:#efebe8;color:#514a45;border-radius:10px;padding:8px 10px;font-weight:700}

.placeholder-input{width:100%;font-size:14px;padding:7px 0}.placeholder-input::placeholder{color:#b2aaa4}.product-button{width:100%;font-size:14px;padding:7px 0;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);text-align:left;min-height:34px}.product-button.empty{color:#b2aaa4}.product-button.active-input{border-bottom-color:#91877f}.repeat-wrap{display:flex;align-items:center;gap:2px}.repeat-prefix{color:#938b84}
.measure-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;min-height:36px}.measure-drag{border:0;background:transparent;color:#b0a8a2;font-size:20px;padding:4px 0;touch-action:none;cursor:grab}.measure-drag:active{cursor:grabbing}.measure-drag.hidden{visibility:hidden}.measure-row.drop-target{background:#f3efec;border-radius:8px}.measure-input{width:100%;font-size:20px;font-weight:650;padding:5px 1px;border:0;background:transparent;text-align:left;color:var(--ink);min-height:34px;display:grid;grid-template-columns:58px 12px 1fr;align-items:baseline;font-variant-numeric:tabular-nums}.measure-input .m-left{text-align:right}.measure-input .m-hyphen{text-align:center}.measure-input .m-right{text-align:left}.measure-input .m-raw{grid-column:1/4;text-align:left}.measure-input.empty{color:#c4bdb7;font-weight:400}
.line-result{font-size:12px;color:#8b837d;white-space:nowrap}.section-totals{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#766f69}.section-totals strong{font-size:14px;color:var(--ink)}
.add-section{width:100%;border:0;background:#efebe8;color:#514a45;border-radius:12px;padding:12px;font-weight:700;margin-top:8px}
.totals{background:#efebe8;border-radius:14px;padding:13px;margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.total-box span{display:block;font-size:11px;color:#766f69}.total-box strong{display:block;font-size:22px;margin-top:2px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:760px;margin:auto;display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;background:#e9e4e0;color:#403a36}.bottom button.primary{background:var(--accent);color:white}
.calc-view{display:none}.calc-view.active{display:block}.edit-view.hidden{display:none}.calc-tabs{display:flex;gap:8px;margin-bottom:8px}.calc-tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:#ece8e5;font-weight:800}.calc-tabs button.active{background:var(--accent);color:white}.calc-export-actions{display:flex;gap:8px;margin-bottom:12px}.calc-export-actions button{flex:1;border:0;border-radius:10px;padding:9px;background:#efebe8;color:#514a45;font-weight:800}
.calc-item{padding:11px 0;border-top:1px solid var(--line)}.calc-item:first-child{border-top:0}.calc-title{display:flex;justify-content:space-between;gap:10px;font-weight:800}.calc-sub{font-size:13px;color:#756e68;margin-top:5px;line-height:1.65}.grand{font-size:26px;font-weight:900;margin-top:8px}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:none;align-items:flex-end}.menu.show{display:flex}.sheet{background:white;width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room-choice-grid{grid-template-columns:repeat(4,1fr)}.choice{border:0;border-radius:11px;padding:13px 8px;background:#eeeae7;font-weight:800}.sheet input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0;font-size:16px}.sheet-actions{display:flex;gap:8px}.sheet-actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800}.primary2{background:var(--accent);color:#fff}.cancel{background:#eeeae7}.delete-section{border:0;background:transparent;color:#aaa29c;font-size:18px;padding:0}


.keypad{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));
  z-index:90;width:min(420px,calc(100% - 24px));
  background:rgba(255,255,255,.98);
  border:1px solid var(--line);border-radius:16px;
  padding:8px 10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.16);
  display:none;
  touch-action:none;
  --key-h:46px;
  --key-font:20px;
}
.keypad.show{display:block}
.keypad-head{
  position:relative;display:flex;align-items:center;justify-content:center;
  height:30px;margin:-2px 0 6px;cursor:grab;touch-action:none;user-select:none;
}
.keypad-head:active{cursor:grabbing}
.keypad-grip{
  position:absolute;left:50%;top:2px;transform:translateX(-50%);
  width:52px;height:5px;border-radius:999px;background:#c7c0ba;
}
.keypad .key-label{
  font-size:11px;color:#8b837d;text-align:center;margin-top:11px;pointer-events:none;
}
.keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keypad button{
  border:0;border-radius:11px;background:#eeeae6;color:var(--ink);
  min-height:var(--key-h);font-size:var(--key-font);font-weight:800;
  touch-action:manipulation;
}
.keypad button.key-enter{grid-row:span 2;background:var(--accent);color:#fff}
.keypad button.key-wide{grid-column:span 2}
.keypad-resize{
  position:absolute;right:2px;bottom:2px;width:28px;height:28px;
  touch-action:none;cursor:nwse-resize;
}
.keypad-resize:before,.keypad-resize:after{
  content:"";position:absolute;right:6px;bottom:6px;border-radius:2px;
  border-right:2px solid #aaa19a;border-bottom:2px solid #aaa19a;
}
.keypad-resize:before{width:13px;height:13px}
.keypad-resize:after{width:7px;height:7px;right:10px;bottom:10px}



.measure-row.active-row{background:#f0ece8;border-radius:10px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
.measure-input.active-input{outline:2px solid #8e847c;outline-offset:2px;border-radius:6px}
.fake-caret{display:inline-block;width:1.5px;height:1.1em;background:#3a3734;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.repeat-button{width:100%;border:0;background:transparent;text-align:left;padding:7px 0;font-size:14px;color:var(--ink)}
.repeat-button.empty{color:#b2aaa4}


.product-keypad{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:95;width:min(680px,calc(100% - 24px));background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:16px;padding:8px 10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;touch-action:none;--pk-h:42px;--pk-font:18px}
.product-keypad.show{display:block}.recent-product-wrap{margin:2px 0 7px}.recent-product-label{font-size:10px;color:#8b837d;margin:0 0 4px}.recent-product-list{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}.recent-product-chip{flex:0 0 auto!important;min-height:30px!important;border-radius:999px!important;padding:4px 10px!important;font-size:12px!important;background:#e7e2de!important;color:#514a45!important;font-weight:800!important}.product-keypad-head{position:relative;display:flex;align-items:center;justify-content:center;height:30px;margin:-2px 0 6px;cursor:grab;touch-action:none;user-select:none}.product-keypad-head:active{cursor:grabbing}.product-keypad-grip{position:absolute;left:50%;top:2px;transform:translateX(-50%);width:52px;height:5px;border-radius:999px;background:#c7c0ba}.product-keypad-label{font-size:11px;color:#8b837d;text-align:center;margin-top:11px;pointer-events:none}
.product-key-row{display:flex;gap:6px;margin-top:6px}.product-key-row.offset1{padding-left:4%}.product-key-row.offset2{padding-left:9%}.product-keypad button{flex:1;border:0;border-radius:10px;background:#eeeae6;color:var(--ink);min-width:0;min-height:var(--pk-h);font-size:var(--pk-font);font-weight:800;touch-action:manipulation;padding:0 4px}.product-keypad button.key-shift.active{background:var(--accent);color:#fff}.product-keypad button.key-done{background:var(--accent);color:#fff;flex:1.45}.product-keypad button.key-back{flex:1.25}
.product-keypad-resize{position:absolute;right:2px;bottom:2px;width:28px;height:28px;touch-action:none;cursor:nwse-resize}.product-keypad-resize:before,.product-keypad-resize:after{content:"";position:absolute;right:6px;bottom:6px;border-radius:2px;border-right:2px solid #aaa19a;border-bottom:2px solid #aaa19a}.product-keypad-resize:before{width:13px;height:13px}.product-keypad-resize:after{width:7px;height:7px;right:10px;bottom:10px}


.product-tools{display:flex;gap:8px;margin:3px 0 8px 48px}
.product-tools button{border:0;background:#f0ece9;color:#625a55;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700}
.product-tools button:disabled{opacity:.42}
.saved-title{font-size:12px;color:#8b837d;margin:10px 0 6px}
.saved-products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:320px;overflow:auto}
.saved-product{border:0;background:#eeeae6;border-radius:10px;padding:10px;text-align:left;color:var(--ink)}
.saved-product strong{display:block;font-size:14px}.saved-product span{display:block;font-size:11px;color:#7b736d;margin-top:2px}


.sheet-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-manage-btn{border:0;background:#eeeae7;color:#514a45;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800}
.choice-wrap{position:relative;min-width:0}
.choice-wrap .choice{width:100%;height:100%}

.saved-product-drag,.saved-product-delete{display:none;position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;background:transparent;color:#8f8780;padding:9px 7px;touch-action:none}
.saved-product-drag{left:2px;font-size:21px;cursor:grab}.saved-product-delete{right:2px;font-size:18px}
.saved-product-wrap.manage .saved-product-drag,.saved-product-wrap.manage .saved-product-delete{display:block}
.saved-product-wrap.drag-target{outline:2px solid #91877f;border-radius:10px}


.choice-edit{display:none;position:absolute;right:29px;top:50%;transform:translateY(-50%);z-index:2;border:0;background:transparent;color:#8f8780;font-size:15px;padding:8px 5px}
.choice-wrap.manage .choice-edit,.choice-wrap.manage .choice-delete{display:block}
.choice-wrap.manage .choice{padding-left:31px;padding-right:54px}
.saved-product-edit{display:none;position:absolute;right:31px;top:50%;transform:translateY(-50%);z-index:2;border:0;background:transparent;color:#8f8780;font-size:15px;padding:9px 7px}
.saved-product-wrap.manage .saved-product-edit{display:block}
.saved-product-wrap.manage .saved-product{padding-left:38px;padding-right:66px}
.manage-footer{display:flex;justify-content:flex-end;margin-top:8px}
.reset-master{border:0;background:transparent;color:#9a6f6f;padding:7px 4px;font-size:11px}


.site-list-btn{border:0;background:#eeeae7;color:#514a45;border-radius:10px;padding:8px 10px;font-weight:800}
.site-manager-sheet{max-height:min(78vh,720px);overflow:hidden;display:flex;flex-direction:column}
.site-manager-top{display:flex;gap:8px;align-items:center;margin:8px 0 10px}
.site-manager-top input{flex:1;background:#f4f1ee;border:0;border-radius:10px;padding:10px 11px;font-size:14px}

.site-filter{display:flex;gap:7px;margin-bottom:8px}

<header><div class="header-row"><div><div class="title">現調</div><div class="tag">職人もデジタル化。</div></div><div class="room-actions"><button id="currentSitePdf" class="site-list-btn pdf-action">現場PDF</button><button id="siteListBtn" class="site-list-btn">現場一覧</button><button id="newSite" class="small-btn">新規</button></div></div></header>

function bindChoiceDrag(handle,wrap,getArray,saveFn,renderFn,itemKey){

    };

function collectUsedProducts(){

    v=String(v||"").trim();

  [...(sites||[])].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).forEach(site=>{
    (site.rooms||[]).forEach(r=>(r.sections||[]).forEach(sec=>{
      if(sec!==activeProductSection)add(sec.product);

}

function measureDisplayParts(v){
  const s=String(v||"").replace(/\*/g,"＊");
  const m=s.match(/^(\d+(?:\.\d+)?)-(\d+)(＊*)$/);
  if(!m)return null;
  return {left:m[1],right:m[2]+(m[3]||"")};
}

    btn.innerHTML=`<span class="m-left">${esc(parts.left)}</span><span class="m-hyphen">-</span><span class="m-right">${esc(parts.right)}</span>`;

  }
}
function syncActiveMeasure(){
  if(!activeMeasureInput||!activeMeasureModel)return;

    .replace(/[＊※]/g,"*")
    .replace(/[×xX]/g,"-")

  renderMeasureButton(activeMeasureInput,activeMeasureModel.value,activeMeasureInput.dataset.placeholder||"");
  activeMeasureInput.classList.toggle("empty",!activeMeasureModel.value);

function moveToNextMeasure(){
  if(!activeMeasureSection||!activeMeasureModel||!activeMeasureList)return;
  if(!activeMeasureModel.value.trim())return;

  let currentIndex=activeMeasureSection.measures.findIndex(x=>x.id===activeMeasureModel.id);
  let next=activeMeasureSection.measures[currentIndex+1];

  if(!next){
    next=blank();
    activeMeasureSection.measures.push(next);
    save();
    let nextRow=addMeasureRowGlobal(activeMeasureSection,next,currentIndex+1,activeMeasureList);
    activeMeasureList.appendChild(nextRow);
  }

  const inputs=activeMeasureList.querySelectorAll(".measure-input");
  const nextInput=inputs[currentIndex+1];
  const nextRow=nextInput?.closest(".measure-row");
  if(nextInput && nextRow){
    const nextModel=activeMeasureSection.measures[currentIndex+1];
    showMeasureKeypad(nextInput,nextModel,activeMeasureSection,activeMeasureList,nextRow);
  }
}
function keypadPress(key){
  if(keypadMode==="repeat"){
    if(!activeRepeatButton||!activeRepeatSection)return;
    if(key==="enter"){hideMeasureKeypad();return}
    if(key==="back"){
      activeRepeatSection.repeat=String(activeRepeatSection.repeat||"").slice(0,-1);
    }else if(/^\d$/.test(key)){
      activeRepeatSection.repeat=String(activeRepeatSection.repeat||"")+key;
    }else{
      return;
    }
    activeRepeatButton.textContent=activeRepeatSection.repeat||"リピート";
    activeRepeatButton.classList.toggle("empty",!activeRepeatSection.repeat);
    save();live();return;
  }

  if(!activeMeasureInput||!activeMeasureModel)return;
  if(key==="enter"){moveToNextMeasure();return}
  if(key==="back"){
    if(activeMeasureInput.value.length){
      activeMeasureInput.value=activeMeasureInput.value.slice(0,-1);
      syncActiveMeasure();

      // ×で最後の1文字まで消したら、余分な空欄行はそのまま残さず削除する。
      // ただし区分内に1行しかない場合は、次の入力用として空欄行を1つ残す。
      if(!activeMeasureModel.value && activeMeasureSection && activeMeasureList && activeMeasureRow && activeMeasureSection.measures.length>1){
        const currentIndex=activeMeasureSection.measures.findIndex(x=>x.id===activeMeasureModel.id);
        const nextIndex=currentIndex < activeMeasureSection.measures.length-1 ? currentIndex+1 : currentIndex-1;
        const nextModel=activeMeasureSection.measures[nextIndex];

        activeMeasureSection.measures=activeMeasureSection.measures.filter(x=>x.id!==activeMeasureModel.id);
        activeMeasureRow.remove();
        save();
        live();

        if(nextModel){
          const nextRow=activeMeasureList.querySelector(`[data-mid="${nextModel.id}"]`);
          const nextInput=nextRow?.querySelector(".measure-input");
          if(nextInput && nextRow){
            showMeasureKeypad(nextInput,nextModel,activeMeasureSection,activeMeasureList,nextRow);
          }
        }
      }
    }
    return;
  }
  if(key==="-"){
    if(!activeMeasureInput.value.includes("-") && activeMeasureInput.value.length) activeMeasureInput.value+="-";
  }else if(key==="*"){
    if(activeMeasureInput.value) activeMeasureInput.value+="*";
  }else{
    activeMeasureInput.value+=key;
  }
  syncActiveMeasure();
}

async function canvasToPdfJpegs(canvas){

function makePdfFromJpegs(images){
  const enc=new TextEncoder(),chunks=[],offsets=[0];
  let length=0;
  const pushText=s=>{const b=enc.encode(s);chunks.push(b);length+=b.length};
  const pushBytes=b=>{chunks.push(b);length+=b.length};
  const objStart=n=>{offsets[n]=length;pushText(`${n} 0 obj\n`)};
  const objEnd=()=>pushText(`endobj\n`);

  const pageW=595.28,pageH=841.89,margin=18;

  const objCount=2+images.length*3;

  images.forEach((im,i)=>{

    const maxW=pageW-margin*2,maxH=pageH-margin*2;
    const scale=Math.min(maxW/im.width,maxH/im.height);
    const drawW=im.width*scale,drawH=im.height*scale;
    const x=(pageW-drawW)/2,y=(pageH-drawH)/2;
    const content=`q\n${drawW.toFixed(3)} 0 0 ${drawH.toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)} cm\n/Im0 Do\nQ\n`;
    const cb=enc.encode(content);

    objStart(pageObj);
    pushText(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>\n`);
    objEnd();

    objStart(imageObj);
    pushText(`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    pushBytes(im.bytes);pushText("\nendstream\n");objEnd();

    objStart(contentObj);
    pushText(`<< /Length ${cb.length} >>\nstream\n`);
    pushBytes(cb);pushText("endstream\n");objEnd();
  });

  const xref=length;
  pushText(`xref\n0 ${objCount+1}\n`);
  pushText("0000000000 65535 f \n");
  for(let n=1;n<=objCount;n++)pushText(`${String(offsets[n]).padStart(10,"0")} 00000 n \n`);

async function buildRoomsPdfFile(siteObj,rooms,fileName,includeSiteTotal=false){

  if(!useful.length)throw new Error("NO_DATA");
  const images=[];
  for(const r of useful){
    const canvas=buildRoomImageCanvas(r,siteObj);
    images.push(await canvasToJpegInfo(canvas));
  }
  if(includeSiteTotal)images.push(await canvasToJpegInfo(buildSiteTotalCanvas(siteObj)));
  const blob=makePdfFromJpegs(images);
  return new File([blob],fileName,{type:"application/pdf"});
}
async function shareOrDownloadFile(file,title){
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title});
      return true;
    }
  }catch(e){
    if(e?.name==="AbortError")return false;
    console.error(e);
  }
  const url=URL.createObjectURL(file),a=document.createElement("a");
  a.href=url;a.download=file.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  return true;
}

function renameRoomChoice(oldName){
  const n=prompt("部屋名を編集",oldName);if(!n)return;
  const name=n.trim();if(!name||name===oldName)return;
  if(roomOrder.includes(name)){alert("同じ部屋名がすでにあります");return}
  const wasDefault=ROOM_NAMES.includes(oldName)&&!deletedRooms.includes(oldName);
  if(wasDefault){
    deletedRooms.push(oldName);saveList(ROOM_DELETED_KEY,deletedRooms);
    if(!savedRooms.includes(name))savedRooms.push(name);
  }else{
    const idx=savedRooms.indexOf(oldName);
    if(idx>=0)savedRooms[idx]=name;else savedRooms.push(name);
  }
  saveList(ROOM_MASTER_KEY,savedRooms);
  const oi=roomOrder.indexOf(oldName);if(oi>=0)roomOrder[oi]=name;
  saveRoomOrder();renderRoomChoices();
}
function deleteRoomChoice(name){
  if(!confirm(`「${name}」を候補一覧から削除しますか？\n入力済みの現場データは消えません。`))return;
  if(ROOM_NAMES.includes(name)&&!deletedRooms.includes(name)){
    deletedRooms.push(name);saveList(ROOM_DELETED_KEY,deletedRooms);
  }
  savedRooms=savedRooms.filter(x=>x!==name);saveList(ROOM_MASTER_KEY,savedRooms);
  roomOrder=roomOrder.filter(x=>x!==name);saveRoomOrder();renderRoomChoices();
}
function renderRoomChoices(){

    const del=document.createElement("button");del.className="choice-delete";del.textContent="×";del.type="button";del.onclick=e=>{e.preventDefault();e.stopPropagation();deleteRoomChoice(name)};

(()=>{
  const kp=$("#measureKeypad"),drag=$("#keypadDragHandle"),resize=$("#keypadResizeHandle");
  if(!kp||!drag||!resize)return;

  drag.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const start=setKeypadFreePosition(); if(!start)return;
    const sx=e.clientX,sy=e.clientY,sl=start.left,st=start.top;
    drag.setPointerCapture?.(e.pointerId);
    const move=ev=>{
      const left=clamp(sl+(ev.clientX-sx),8,Math.max(8,window.innerWidth-kp.offsetWidth-8));
      const top=clamp(st+(ev.clientY-sy),8,Math.max(8,window.innerHeight-kp.offsetHeight-8));
      kp.style.left=left+"px";kp.style.top=top+"px";
    };
    const up=ev=>{
      drag.releasePointerCapture?.(e.pointerId);
      drag.removeEventListener("pointermove",move);drag.removeEventListener("pointerup",up);drag.removeEventListener("pointercancel",up);
      saveKeypadLayout();
    };
    drag.addEventListener("pointermove",move);drag.addEventListener("pointerup",up);drag.addEventListener("pointercancel",up);
  });

  resize.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const start=setKeypadFreePosition(); if(!start)return;
    const sx=e.clientX,sw=start.width,sl=start.left,st=start.top;
    resize.setPointerCapture?.(e.pointerId);
    const move=ev=>{
      const maxW=Math.min(540,window.innerWidth-sl-8);
      const w=clamp(sw+(ev.clientX-sx),270,Math.max(270,maxW));
      kp.style.width=w+"px";
      const ratio=w/420;
      kp.style.setProperty("--key-h",clamp(Math.round(46*ratio),40,60)+"px");
      kp.style.setProperty("--key-font",clamp(Math.round(20*ratio),17,25)+"px");
      kp.style.left=sl+"px";kp.style.top=clamp(st,8,Math.max(8,window.innerHeight-kp.offsetHeight-8))+"px";
    };
    const up=ev=>{
      resize.releasePointerCapture?.(e.pointerId);
      resize.removeEventListener("pointermove",move);resize.removeEventListener("pointerup",up);resize.removeEventListener("pointercancel",up);
      saveKeypadLayout();
    };
    resize.addEventListener("pointermove",move);resize.addEventListener("pointerup",up);resize.addEventListener("pointercancel",up);
  });

  window.addEventListener("resize",()=>{keepKeypadOnScreen();if(keypadLayout)saveKeypadLayout()});
})();

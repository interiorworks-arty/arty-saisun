/* ===== v2.4.30 面積計算 ===== */
.area-calc-wrap{display:flex;flex-direction:column;gap:12px;padding-bottom:120px}

.area-submode{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}.area-submode button{border:1px solid #dcd4ce;background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:800}.area-submode button.active{background:#ece7e3;border-color:#a99d95}

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function applyKeypadLayout(){
  const kp=$("#measureKeypad"); if(!kp)return;

  // iPadでは初回だけ右下を初期位置にする。
  // 一度ユーザーが動かした後は、その位置を今まで通り記憶する。
  if(!keypadLayout && window.innerWidth>=700){
    const maxW=Math.max(270,window.innerWidth-16);
    const w=clamp(420,270,Math.min(540,maxW));
    kp.style.width=w+"px";
    kp.style.transform="none";
    kp.style.bottom="auto";
    const keyH=clamp(Math.round(46*(w/420)),40,60);
    const keyFont=clamp(Math.round(20*(w/420)),17,25);
    kp.style.setProperty("--key-h",keyH+"px");
    kp.style.setProperty("--key-font",keyFont+"px");
    requestAnimationFrame(()=>{
      const rect=kp.getBoundingClientRect();
      const left=Math.max(8,window.innerWidth-rect.width-18);
      const bottomGap=86;
      const top=Math.max(8,window.innerHeight-rect.height-bottomGap);
      kp.style.left=left+"px";
      kp.style.top=top+"px";
    });
    return;
  }

  if(keypadLayout){
    const maxW=Math.max(270,window.innerWidth-16);
    const w=clamp(+keypadLayout.width||420,270,Math.min(540,maxW));
    kp.style.width=w+"px";
    kp.style.transform="none";
    kp.style.bottom="auto";
    const keyH=clamp(Math.round(46*(w/420)),40,60);
    const keyFont=clamp(Math.round(20*(w/420)),17,25);
    kp.style.setProperty("--key-h",keyH+"px");
    kp.style.setProperty("--key-font",keyFont+"px");
    requestAnimationFrame(()=>{
      const rect=kp.getBoundingClientRect();
      const left=clamp(+keypadLayout.left||8,8,Math.max(8,window.innerWidth-rect.width-8));
      const top=clamp(+keypadLayout.top||80,8,Math.max(8,window.innerHeight-rect.height-8));
      kp.style.left=left+"px";kp.style.top=top+"px";
    });
  }
}

      const r=viewport.getBoundingClientRect();
      if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
      if(touches.size>=2){
        e.preventDefault();
        if(drawing&&current)cancelStroke();
        updateGesture();
      }else if(memoFingerDraw&&drawing&&e.pointerId===drawPointerId&&current){
        e.preventDefault();
        const before=current.points.length;
        const pts=memoInkEventPoints(e,canvas);
        for(const pt of pts){
          const last=current.points[current.points.length-1];
          if(!last||Math.abs(pt.x-last.x)>.00015||Math.abs(pt.y-last.y)>.00015)current.points.push(pt);
        }
        if(current.points.length>before){
          current.lastMoveTime=performance.now();
          memoInkDrawLiveSegment(canvas,current,before);
        }
      }else if(!memoFingerDraw&&touches.size===1){
        e.preventDefault();
        gesture=null;
        if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId){
          const dy=e.clientY-pageScrollGesture.startClientY;
          window.scrollTo(0,pageScrollGesture.startScrollY-dy);
          pageScrollGesture.lastClientY=e.clientY;
        }
      }
    }
  });

  canvas.addEventListener("pointerup",e=>{
    if(e.pointerType==="pen"){
      finishStroke(e);return;
    }
    if(e.pointerType==="touch"){
      if(drawing&&e.pointerId===drawPointerId&&touches.size<=1)finishStroke(e);
      touches.delete(e.pointerId);
      if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId)pageScrollGesture=null;
      if(touches.size<2)gesture=null;
    }
  });
  canvas.addEventListener("pointercancel",e=>{
    if(e.pointerType==="touch"){
      touches.delete(e.pointerId);
      if(pageScrollGesture&&pageScrollGesture.pointerId===e.pointerId)pageScrollGesture=null;
    }
    if(drawing&&e.pointerId===drawPointerId)cancelStroke();
    if(!touches.size)gesture=null;
  });

  let inkResizeRaf=0;
  const ro=new ResizeObserver(()=>{
    cancelAnimationFrame(inkResizeRaf);
    inkResizeRaf=requestAnimationFrame(()=>{redraw();clampMemoInkView(stage,viewport,fileId)});
  });
  ro.observe(stage||canvas.parentElement||canvas);

  const toggle=card.querySelector(".memo-ink-toggle");
  if(toggle)toggle.onclick=()=>{
    memoInkMode=!memoInkMode;
    if(!memoInkMode){memoFingerDraw=false;cancelStroke();touches.clear();gesture=null;pageScrollGesture=null}
    refreshMemoInkCards();
  };
  const finger=card.querySelector(".memo-finger-toggle");
  if(finger)finger.onclick=()=>{memoFingerDraw=!memoFingerDraw;cancelStroke();touches.clear();gesture=null;pageScrollGesture=null;refreshMemoInkCards()};
  card.querySelectorAll(".memo-ink-tool").forEach(b=>b.onclick=()=>{memoInkTool=b.dataset.tool;refreshMemoInkCards()});
  card.querySelectorAll(".memo-ink-color").forEach(b=>b.onclick=()=>{memoInkColor=b.dataset.color;memoInkTool="pen";refreshMemoInkCards()});
  card.querySelectorAll(".memo-ink-width").forEach(b=>b.onclick=()=>{memoInkWidth=Number(b.dataset.width)||4;refreshMemoInkCards()});
  const undo=card.querySelector(".memo-ink-undo");
  if(undo)undo.onclick=()=>{const rec=memoInkRecord(fileId);if(rec.strokes.length){rec.redo.push(rec.strokes.pop());save();redraw();refreshMemoInkCards()}};
  const redo=card.querySelector(".memo-ink-redo");
  if(redo)redo.onclick=()=>{const rec=memoInkRecord(fileId);if(rec.redo.length){rec.strokes.push(rec.redo.pop());save();redraw();refreshMemoInkCards()}};
  const reset=card.querySelector(".memo-zoom-reset");
  if(reset)reset.onclick=()=>{memoInkViews.set(fileId,{scale:1,x:0,y:0});applyMemoInkView(stage,fileId)};

  applyMemoInkView(stage,fileId);
  updateCard();setTimeout(()=>{redraw();clampMemoInkView(stage,viewport,fileId)},50);
}

async function memoDbAllForSite(siteId){

async function detectPdfPageRatio(blob){
  try{
    const buf=await blob.slice(0,512*1024).arrayBuffer();
    const bytes=new Uint8Array(buf);
    let s="";
    // PDF objects are mostly ASCII around MediaBox/CropBox. Read enough for first page metadata.
    const chunk=32768;
    for(let i=0;i<bytes.length;i+=chunk){
      s+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+chunk)));
    }
    const boxRe=/(?:\/MediaBox|\/CropBox)\s*\[\s*([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s+([+-]?\d*\.?\d+)\s*\]/g;
    let m;
    while((m=boxRe.exec(s))){
      const x1=Number(m[1]),y1=Number(m[2]),x2=Number(m[3]),y2=Number(m[4]);
      const w=Math.abs(x2-x1),h=Math.abs(y2-y1);
      if(w>10&&h>10)return {ratio:w/h,width:w,height:h,landscape:w>h};
    }
  }catch(e){console.warn("PDF page size detect failed",e)}
  return {ratio:1.414,width:842,height:595,landscape:true};
}
async function renderMemoPdfCanvasStack(container,blob){
  if(!container)return;
  container.innerHTML='<div class="memo-pdf-loading">PDFを読み込み中…</div>';
  if(!window.pdfjsLib){
    container.innerHTML='<div class="memo-pdf-fallback">PDF表示ライブラリを読み込めませんでした。「開く」から確認してください。</div>';
    return false;
  }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const data=new Uint8Array(await blob.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    container.innerHTML='';
    const cssWidth=Math.max(320,container.clientWidth||container.parentElement?.clientWidth||1000);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      const page=await pdf.getPage(pageNo);
      const base=page.getViewport({scale:1});
      const cssScale=cssWidth/base.width;
      const renderViewport=page.getViewport({scale:cssScale*dpr});
      const cssViewport=page.getViewport({scale:cssScale});
      const c=document.createElement('canvas');
      c.className='memo-pdf-page-canvas';
      c.width=Math.ceil(renderViewport.width);
      c.height=Math.ceil(renderViewport.height);
      c.style.width=Math.round(cssViewport.width)+'px';
      c.style.height=Math.round(cssViewport.height)+'px';
      c.dataset.page=String(pageNo);
      container.appendChild(c);
      const ctx=c.getContext('2d',{alpha:false});
      await page.render({canvasContext:ctx,viewport:renderViewport}).promise;
    }
    return true;
  }catch(e){
    console.error('PDF canvas render failed',e);
    container.innerHTML='<div class="memo-pdf-fallback">PDFの表示に失敗しました。「開く」から確認してください。</div>';
    return false;
  }
}

function orderFmtNum(n){
  const x=Number(n)||0;
  return (Math.round((x+Number.EPSILON)*100)/100).toString();
}
function orderDisplayIdentity(item){
  const name=String(item.itemName||"").trim();
  const product=String(item.product||"").trim();
  if(name&&product)return {name,product};
  if(name)return {name,product:""};
  if(product)return {name:item.type||"商品",product};
  return null;
}

function ensureOrderOverrides(siteObj=state){
  if(!siteObj.orderOverrides||typeof siteObj.orderOverrides!=="object"||Array.isArray(siteObj.orderOverrides))siteObj.orderOverrides={};
  return siteObj.orderOverrides;
}
function orderOverrideFor(siteObj,key){
  const all=ensureOrderOverrides(siteObj);
  return all[key]||null;
}
function orderHasOverride(siteObj,key){
  const ov=orderOverrideFor(siteObj,key);
  if(!ov)return false;
  if(ov.qty!==undefined&&String(ov.qty).trim()!=="")return true;
  if(ov.cutCounts&&Object.values(ov.cutCounts).some(v=>String(v).trim()!==""))return true;
  if(ov.cutLengths&&Object.values(ov.cutLengths).some(v=>String(v).trim()!==""))return true;
  return false;
}
function orderCutSig(c){
  return [orderFmtNum(c.length),c.lengthUnit||"m",c.countUnit||"本"].join("|");
}
function resetOrderOverride(key){
  const all=ensureOrderOverrides(state);
  delete all[key];
  save();renderOrderPage();
}
function editableOrderOverride(key){
  const all=ensureOrderOverrides(state);
  if(!all[key])all[key]={};
  return all[key];
}
function collectOrderData(siteObj=state){
  const groups={wall:[],floor:[],sheet:[],other:[]};

  // クロス：品番別に集計し、使用箇所は区分別ではなく「部屋ごとの合計」で表示
  const wallMap=new Map();
  (siteObj.rooms||[]).forEach(r=>{
    const roomByProduct=new Map();
    (r.sections||[]).forEach(sec=>{
      const product=effectiveWallProduct(sec,siteObj);
      if(!product)return;
      const t=secTotals(sec,siteObj);
      if(!t.withR)return;
      roomByProduct.set(product,(roomByProduct.get(product)||0)+t.withR);
    });
    roomByProduct.forEach((roomQty,product)=>{
      if(!wallMap.has(product))wallMap.set(product,{name:product,product:"",qty:0,rooms:[],roomTotals:[]});
      const g=wallMap.get(product);
      g.qty+=roomQty;
      g.rooms.push(r.name);
      g.roomTotals.push({room:r.name,qty:roomQty});
    });
  });
  groups.wall=[...wallMap.values()].map(x=>{
    const orderKey=`wall|${String(x.name||"").toLowerCase()}`;
    const autoOrderValue=Math.round((Number(x.qty)||0)*100)/100;
    const ov=orderOverrideFor(siteObj,orderKey);
    const hasOverride=ov&&ov.qty!==undefined&&String(ov.qty).trim()!=="";
    const orderValue=hasOverride?(Number(ov.qty)||0):autoOrderValue;
    return {...x,mode:"wall",orderKey,autoOrderValue,orderValue,orderUnit:"m",
      autoQtyText:`${orderFmtNum(autoOrderValue)}m`,
      qtyText:`${orderFmtNum(orderValue)}m`,hasOverride:!!hasOverride};
  });

  ensureFinishRooms(siteObj);
  const finishMap={floor:new Map(),sheet:new Map(),other:new Map()};

  (siteObj.finishRooms||[]).forEach(r=>(r.finishMaterials||[]).forEach(item=>{
    const id=orderDisplayIdentity(item);
    if(!id)return;
    const page=item.page||finishPageFromKind(item.kind||item.type);
    if(!finishMap[page])return;
    const kind=item.kind||item.type;
    let mode="qty", keyExtra="", qtyNum=0, unit="", detail="", cuts=[];

    if(kind==="CF"||kind==="リアテック"||kind==="ダイノック"){
      mode="cuts";
      cuts=(item.orderCuts||[]).filter(x=>(Number(x.length)||0)>0&&(Number(x.count)||0)>0);
      keyExtra="cuts";
      detail=cuts.length?cuts.map(x=>`${orderFmtNum(x.length)}${x.lengthUnit||"m"}×${orderFmtNum(x.count)}${x.countUnit||"本"}`).join(" / "):"発注寸法未入力";
    }else if(kind==="フロアタイル"){
      if(item.saleMode==="loose"){
        mode="qty";qtyNum=Number(item.pieces)||0;unit="枚";keyExtra="loose";
      }else{
        mode="tilecase";
        const area=Number(item.area)||0,per=Number(item.caseSqm)||0;
        qtyNum=area;unit="㎡";keyExtra=`case:${per}`;
        detail=per?`1ケース ${orderFmtNum(per)}㎡`:"1ケース㎡数 未入力";
      }
    }else if(kind==="ソフト巾木"){
      mode="basecase";
      qtyNum=Number(item.qty)||0;unit="m";
      const per=Number(item.caseMeters)||0;keyExtra=`base:${per}`;
      detail=per?`1ケース ${orderFmtNum(per)}m`:"1ケースm数 未入力";
    }else{
      const enteredCuts=(item.orderCuts||[]).filter(x=>(Number(x.length)||0)>0||(Number(x.count)||0)>0);
      if(enteredCuts.length){
        mode="cuts";cuts=enteredCuts;keyExtra="cuts";
        detail=enteredCuts.map(x=>{
          const len=Number(x.length)||0,count=Number(x.count)||0;
          const cu=x.countUnit||"本";return len>0&&count>0?`${orderFmtNum(len)}${x.lengthUnit||"m"}×${orderFmtNum(count)}${cu}`:count>0?`${orderFmtNum(count)}${cu}`:`${orderFmtNum(len)}${x.lengthUnit||"m"}`;
        }).join(" / ");
      }else{
        mode="qty";qtyNum=Number(item.qty)||0;unit=String(item.unit||"").trim()||"";

        let row=g.cuts.find(x=>Math.abs((Number(x.length)||0)-len)<1e-9&&(x.lengthUnit||"m")===lengthUnit&&(x.countUnit||"本")===countUnit);

          if(countChanged||lengthChanged)hasOverride=true;

        });
        autoQtyText=g.cuts.length?g.cuts.map(x=>{

        }).join(" / "):"発注数量未入力";
        qtyText=g.cuts.length?g.cuts.map(x=>{
          const len=Number(x.orderLength)||0,cu=x.countUnit||"本";
          return len>0?`${orderFmtNum(len)}${x.lengthUnit||"m"}×${orderFmtNum(x.orderCount)}${cu}`:`${orderFmtNum(x.orderCount)}${cu}`;

        orderValue=hasOverride?(Number(raw)||0):autoOrderValue;

      }else if(g.mode==="basecase"){
        autoOrderValue=g.casePer>0&&g.qtyNum>0?Math.ceil(g.qtyNum/g.casePer):0;orderUnit="ケース";
        const raw=ov?.qty;hasOverride=raw!==undefined&&String(raw).trim()!=="";
        orderValue=hasOverride?(Number(raw)||0):autoOrderValue;
        autoQtyText=autoOrderValue>0?`${orderFmtNum(autoOrderValue)}ケース`:"発注数量未入力";
        qtyText=orderValue>0?`${orderFmtNum(orderValue)}ケース`:"発注数量未入力";
        detail=`採寸 ${orderFmtNum(g.qtyNum)}m${g.casePer?` / 1ケース ${orderFmtNum(g.casePer)}m`:""}`;
      }else{

const PHOTO_DB_NAME="gencho-photo-db-v1",PHOTO_STORE="photos",MEMO_FILE_STORE="memoFiles";

function createPhotoPagePlan(records,cfg={}){
  const bodyTop=Number(cfg.bodyTop)||0,bodyHeight=Number(cfg.bodyHeight)||3,bodyWidth=Number(cfg.bodyWidth)||2,bodyLeft=Number(cfg.bodyLeft)||0;
  const colGap=cfg.colGap==null?0.12:Number(cfg.colGap),gap=cfg.gap==null?0:Number(cfg.gap);
  const thirdBlockH=cfg.thirdBlockH==null?1:Number(cfg.thirdBlockH),halfBlockH=cfg.halfBlockH==null?1.5:Number(cfg.halfBlockH);
  const maxY=bodyTop+bodyHeight,halfW=(bodyWidth-colGap)/2,pages=[];
  let items=[],currentY=bodyTop,halfRowOpen=false;
  const pushPage=()=>{if(items.length)pages.push(items);items=[];currentY=bodyTop;halfRowOpen=false};
  (records||[]).forEach(rec=>{
    const size=photoSizeOf(rec);
    if(size==="1/6"){
      if(!halfRowOpen){
        if(currentY+thirdBlockH>maxY&&items.length)pushPage();
        items.push({rec,size,x:bodyLeft,y:currentY,w:halfW,h:thirdBlockH});
        halfRowOpen=true;
      }else{
        items.push({rec,size,x:bodyLeft+halfW+colGap,y:currentY,w:halfW,h:thirdBlockH});
        currentY+=thirdBlockH+gap;
        halfRowOpen=false;
      }
      return;
    }
    if(halfRowOpen){
      currentY+=thirdBlockH+gap;
      halfRowOpen=false;
      if(currentY>maxY&&items.length)pushPage();
    }
    const blockH=size==="1/2"?halfBlockH:thirdBlockH;
    if(currentY+blockH>maxY&&items.length)pushPage();
    items.push({rec,size,x:bodyLeft,y:currentY,w:bodyWidth,h:blockH});
    currentY+=blockH+gap;
  });
  if(items.length)pages.push(items);
  return pages;
}
function photoCanvasLayout(base){
  const bodyTop=base.y,bodyLeft=base.pad+25,bodyRight=base.width-base.pad-25,bodyWidth=bodyRight-bodyLeft;
  const gap=26,colGap=26,bottomPad=64;
  // canvas は高解像度化で実ピクセルが2倍なので、配置計算は論理サイズへ戻す
  const logicalHeight=base.c.height/EXPORT_RENDER_SCALE;
  const bodyHeight=Math.max(1,logicalHeight-bodyTop-bottomPad);
  const thirdBlockH=Math.floor((bodyHeight-gap*2)/3);
  const halfBlockH=Math.floor((bodyHeight-gap)/2);
  return {bodyTop,bodyLeft,bodyWidth,bodyHeight,gap,colGap,thirdBlockH,halfBlockH};
}

function openPhotoDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PHOTO_DB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)){
        const st=db.createObjectStore(PHOTO_STORE,{keyPath:"id"});
        st.createIndex("siteId","siteId",{unique:false});
      }
      if(!db.objectStoreNames.contains(MEMO_FILE_STORE)){
        const ms=db.createObjectStore(MEMO_FILE_STORE,{keyPath:"id"});
        ms.createIndex("siteId","siteId",{unique:false});
        ms.createIndex("memoPageId","memoPageId",{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function photoDbAllForSite(siteId){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readonly"),st=tx.objectStore(PHOTO_STORE),idx=st.index("siteId"),req=idx.getAll(siteId);
    req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>(a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0)));
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>db.close();
  });
}
async function photoDbPut(rec){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");tx.objectStore(PHOTO_STORE).put(rec);
    tx.oncomplete=()=>{db.close();resolve(rec)};tx.onerror=()=>{db.close();reject(tx.error)};
  });
}
async function photoDbPutMany(records){
  const list=(records||[]).filter(Boolean);
  if(!list.length)return [];
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");
    const st=tx.objectStore(PHOTO_STORE);
    try{
      list.forEach(rec=>st.put(rec));
    }catch(err){
      try{tx.abort()}catch{}
      db.close();
      reject(err);
      return;
    }
    tx.oncomplete=()=>{db.close();resolve(list)};
    tx.onerror=()=>{const err=tx.error||new Error("PHOTO_BATCH_SAVE");db.close();reject(err)};
    tx.onabort=()=>{const err=tx.error||new Error("PHOTO_BATCH_ABORT");db.close();reject(err)};
  });
}
async function photoDbDelete(id){
  const db=await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE,"readwrite");tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};
  });
}

}

function editPhotoRoomName(roomName,currentRooms=[]){

  const duplicate=(currentRooms||[]).some(n=>n!==roomName&&photoRoomDisplayName(n,state)===next);
  if(duplicate){alert("同じ部屋名がすでにあります");return false}

  else state.photoRoomAliases[roomName]=next;

}
function photoRoomNamesFromSite(siteObj=state,photos=[]){
  ensurePhotoRoomPrefs(siteObj);
  const raw=[],seen=new Set(),add=n=>{n=String(n||"").trim();if(!n||seen.has(n))return;seen.add(n);raw.push(n)};
  // 写真ページは独立運用。初期は「全室」だけ、必要な部屋だけ自由追加する。
  add("共通");
  (siteObj.photoCustomRooms||[]).forEach(add);
  // 既存データ保護：過去に保存済みの写真がある部屋は引き続き表示する。
  photos.forEach(p=>add(p.roomName));

  const hidden=new Set(siteObj.photoHiddenRooms||[]);
  const visible=raw.filter(n=>!hidden.has(n)||n==="共通");
  const saved=(siteObj.photoRoomOrder||[]).filter(n=>visible.includes(n));
  visible.forEach(n=>{if(!saved.includes(n))saved.push(n)});
  // 全室は初期・基準部屋として必ず先頭に置く。
  const withoutCommon=saved.filter(n=>n!=="共通");
  siteObj.photoRoomOrder=["共通",...withoutCommon];
  return siteObj.photoRoomOrder;
}
function hidePhotoRoom(roomName){

function reorderPhotoRoom(fromName,toName,currentRooms=null){
  ensurePhotoRoomPrefs(state);
  const arr=[...(currentRooms||state.photoRoomOrder||[])];
  const from=arr.indexOf(fromName),to=arr.indexOf(toName);
  if(from<0||to<0||from===to)return;
  const [moved]=arr.splice(from,1);arr.splice(to,0,moved);
  state.photoRoomOrder=[...arr];
  save();
}
function compressPhotoFile(file,maxSide=1600,quality=.82){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error("PHOTO_ENCODE"))},"image/jpeg",quality);
      }catch(e){URL.revokeObjectURL(url);reject(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("PHOTO_LOAD"))};
    img.src=url;
  });
}
function mediaTypeOf(rec){
  if(rec?.mediaType)return rec.mediaType;
  const t=String(rec?.mimeType||rec?.blob?.type||"").toLowerCase();
  return t.startsWith("video/")?"video":"image";
}
function videoThumbnailBlob(blob){
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(blob),v=document.createElement("video");
    v.preload="metadata";v.muted=true;v.playsInline=true;
    let done=false;
    const finish=x=>{if(done)return;done=true;URL.revokeObjectURL(url);resolve(x||null)};
    const grab=()=>{
      try{
        const w=v.videoWidth||640,h=v.videoHeight||360;
        if(!w||!h){finish(null);return}
        const max=900,scale=Math.min(1,max/Math.max(w,h));
        const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>finish(b),"image/jpeg",.78);
      }catch{finish(null)}
    };
    v.onloadedmetadata=()=>{
      try{
        const target=Math.min(.3,Math.max(0,(Number(v.duration)||0)/4));
        if(target>0){v.currentTime=target}else grab();
      }catch{grab()}
    };
    v.onseeked=grab;
    v.onerror=()=>finish(null);
    setTimeout(()=>finish(null),6000);
    v.src=url;v.load();
  });
}
async function addPhotoFiles(files,roomName){
  const arr=[...files].filter(f=>{
    const t=String(f?.type||"").toLowerCase();
    return f&&(t.startsWith("image/")||t.startsWith("video/"));
  });
  if(!arr.length)return;
  const existing=(await photoDbAllForSite(state.id)).filter(p=>p.roomName===roomName);
  let order=existing.length?Math.max(...existing.map(x=>Number(x.order)||0))+1:1;
  for(const file of arr){
    try{
      const isVideo=String(file.type||"").toLowerCase().startsWith("video/");
      if(isVideo){
        const thumbBlob=await videoThumbnailBlob(file);
        await photoDbPut({id:uid(),siteId:state.id,roomName,stage:"unset",size:"1/6",blob:file,thumbBlob,mediaType:"video",mimeType:file.type||"video/mp4",note:"",order:order++,createdAt:Date.now()});
      }else{
        const blob=await compressPhotoFile(file);
        await photoDbPut({id:uid(),siteId:state.id,roomName,stage:"unset",size:"1/6",blob,mediaType:"image",mimeType:"image/jpeg",note:"",order:order++,createdAt:Date.now()});
      }
    }catch(e){console.error(e);alert("写真・動画の追加に失敗したものがあります")}
  }
  if(activeWorkPage==="photo")await renderPhotoPage();
}
function ensurePhotoMediaOrder(siteObj=state){
  if(!siteObj.photoMediaOrder||typeof siteObj.photoMediaOrder!=="object"||Array.isArray(siteObj.photoMediaOrder))siteObj.photoMediaOrder={};
}
function sortPhotoRecordsForView(records,roomName,siteObj=state){
  ensurePhotoMediaOrder(siteObj);
  const key=photoMediaOrderKey(roomName);
  const saved=Array.isArray(siteObj.photoMediaOrder[key])?siteObj.photoMediaOrder[key]:[];
  const byId=new Map(records.map(r=>[r.id,r]));
  const out=[];
  saved.forEach(id=>{const r=byId.get(id);if(r){out.push(r);byId.delete(id)}});
  records.forEach(r=>{if(byId.has(r.id)){out.push(r);byId.delete(r.id)}});
  siteObj.photoMediaOrder[key]=out.map(r=>r.id);
  return out;
}
function savePhotoMediaDomOrder(roomName,grid){
  ensurePhotoMediaOrder(state);
  const ids=[...grid.querySelectorAll(".photo-card[data-photo-id]")].map(el=>el.dataset.photoId).filter(Boolean);
  state.photoMediaOrder[photoMediaOrderKey(roomName)]=ids;
  save();
}
async function reorderPhoto(roomName,fromId,toId){
  if(fromId===toId)return;
  const all=await photoDbAllForSite(state.id);
  const room=sortPhotoRecordsForView(all.filter(p=>p.roomName===roomName),roomName,state);
  const ids=room.map(x=>x.id),from=ids.indexOf(fromId),to=ids.indexOf(toId);
  if(from<0||to<0||from===to)return;
  const [m]=ids.splice(from,1);ids.splice(to,0,m);
  ensurePhotoMediaOrder(state);state.photoMediaOrder[photoMediaOrderKey(roomName)]=ids;save();
  await renderPhotoPage();
}
function closeMediaPreview(){
  const img=$("#photoLightboxImage"),video=$("#photoLightboxVideo");
  if(img?.dataset.url){URL.revokeObjectURL(img.dataset.url);delete img.dataset.url}
  if(video?.dataset.url){video.pause();URL.revokeObjectURL(video.dataset.url);delete video.dataset.url;video.removeAttribute("src");video.load()}
  if(img){img.removeAttribute("src");img.style.display=""}
  if(video)video.style.display="none";
  $("#photoLightbox")?.classList.remove("show");
}
function openPhotoPreview(rec){
  const type=mediaTypeOf(rec),img=$("#photoLightboxImage"),video=$("#photoLightboxVideo");
  closeMediaPreview();
  if(type==="video"){
    const url=URL.createObjectURL(rec.blob);video.dataset.url=url;video.src=url;video.style.display="block";img.style.display="none";
  }else{
    const url=URL.createObjectURL(rec.blob);img.dataset.url=url;img.src=url;img.style.display="";video.style.display="none";
  }
  $("#photoLightbox").classList.add("show");
  $("#photoLightboxClose").onclick=closeMediaPreview;
  $("#photoLightbox").onclick=e=>{if(e.target.id==="photoLightbox")closeMediaPreview()};
}

let photoSelectRoom=null,photoSelectedIds=new Set();
function photoHitTargetAtPoint(clientX,clientY,draggedEl,selector,container){
  if(!draggedEl)return null;
  const prev=draggedEl.style.pointerEvents;
  draggedEl.style.pointerEvents="none";
  const hit=document.elementFromPoint(clientX,clientY)?.closest?.(selector)||null;
  draggedEl.style.pointerEvents=prev;
  return hit&&(!container||container.contains(hit))?hit:null;
}
function clearPhotoSelection(){
  photoSelectRoom=null;photoSelectedIds=new Set();
}
function togglePhotoSelection(roomName,id){
  if(photoSelectRoom!==roomName){photoSelectRoom=roomName;photoSelectedIds=new Set()}
  if(photoSelectedIds.has(id))photoSelectedIds.delete(id);else photoSelectedIds.add(id);
}

function updatePhotoSelectionUI(card,roomName){
  if(photoSelectRoom!==roomName)return;
  card.querySelectorAll(".photo-card.select-mode").forEach(pc=>{
    const id=pc.dataset.photoId;
    const selected=photoSelectedIds.has(id);
    pc.classList.toggle("selected",selected);
    const mark=pc.querySelector(".photo-select-check");
    if(mark)mark.textContent=selected?"✓":"";

  card.querySelectorAll(".photo-select-delete").forEach(del=>{
    del.textContent=`選択した${photoSelectedIds.size}件を削除`;
  });
}
function selectAllPhotosForRoom(roomName,ids,card){
  photoSelectRoom=roomName;photoSelectedIds=new Set(ids);updatePhotoSelectionUI(card,roomName);
}
function clearAllPhotosForRoom(roomName,card){
  if(photoSelectRoom!==roomName)return;
  photoSelectedIds.clear();updatePhotoSelectionUI(card,roomName);
}
async function deleteSelectedPhotos(roomName){
  const ids=[...photoSelectedIds];
  if(!ids.length){alert("削除する写真・動画を選択してください");return}
  if(!confirm(`選択した${ids.length}件の写真・動画を削除しますか？`))return;
  for(const id of ids)await photoDbDelete(id);
  clearPhotoSelection();
  await renderPhotoPage();
}
function insertPhotoPageMarkers(grid,records=[]){
  if(!grid)return;
  grid.querySelectorAll(".photo-output-page-start,.photo-output-page-break").forEach(el=>el.remove());
  const cards=[...grid.querySelectorAll(":scope > .photo-card")];
  if(!cards.length)return;
  const plan=createPhotoPagePlan(records,{bodyTop:0,bodyHeight:3,bodyLeft:0,bodyWidth:2,colGap:0.14,gap:0,thirdBlockH:1,halfBlockH:1.5});
  if(!plan.length)return;
  let cursor=0;
  const starts=[];
  plan.forEach(page=>{starts.push(cursor);cursor+=page.length});
  for(let page=plan.length-1;page>=0;page--){
    const firstCard=cards[starts[page]];
    if(!firstCard)continue;
    const start=document.createElement("div");
    start.className="photo-output-page-start"+(page===0?" first":"");
    start.textContent=`出力 ${page+1}ページ目`;
    grid.insertBefore(start,firstCard);
    if(page>0){
      const br=document.createElement("div");
      br.className="photo-output-page-break";
      br.innerHTML=`<span>↑ ${page}ページ目ここまで</span><span>↓ ${page+1}ページ目ここから</span>`;
      grid.insertBefore(br,start);
    }
  }
}

        const drag=pc.querySelector(".photo-drag");
        drag.onpointerdown=e=>{
          if(selecting)return;
          e.preventDefault();e.stopPropagation();
          const pointerId=e.pointerId;
          pc.classList.add("photo-dragging");
          try{drag.setPointerCapture?.(pointerId)}catch{}
          let changed=false;
          const move=ev=>{
            if(ev.pointerId!==pointerId)return;
            const cards=[...grid.querySelectorAll(".photo-card")].filter(el=>el!==pc);
            let hit=null;
            for(const el of cards){
              const r=el.getBoundingClientRect();
              if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){hit=el;break}
            }
            grid.querySelectorAll(".photo-card.drag-target").forEach(x=>x.classList.remove("drag-target"));
            if(!hit)return;
            hit.classList.add("drag-target");
            const all=[...grid.querySelectorAll(".photo-card")];
            const from=all.indexOf(pc),to=all.indexOf(hit);
            if(from<0||to<0||from===to)return;
            if(from<to)grid.insertBefore(pc,hit.nextSibling);else grid.insertBefore(pc,hit);
            changed=true;
          };
          const finish=ev=>{
            if(ev.pointerId!==undefined&&ev.pointerId!==pointerId)return;
            grid.querySelectorAll(".photo-card.drag-target").forEach(x=>x.classList.remove("drag-target"));
            pc.classList.remove("photo-dragging");
            try{drag.releasePointerCapture?.(pointerId)}catch{}
            drag.removeEventListener("pointermove",move);drag.removeEventListener("pointerup",finish);drag.removeEventListener("pointercancel",finish);
            if(changed){
              savePhotoMediaDomOrder(roomName,grid);
              const ordered=[...grid.querySelectorAll('.photo-card[data-photo-id]')].map(el=>roomPhotos.find(r=>r.id===el.dataset.photoId)).filter(Boolean);
              insertPhotoPageMarkers(grid,ordered);
            }
          };
          drag.addEventListener("pointermove",move);drag.addEventListener("pointerup",finish);drag.addEventListener("pointercancel",finish);
        };
        grid.appendChild(pc);
      });
      insertPhotoPageMarkers(grid,roomPhotos);
      wrap.appendChild(card);
    });
    if(state.id!==renderSiteId)return;
    area.innerHTML="";area.appendChild(wrap);
    updateRoomSideNav();
  }catch(e){
    console.error(e);area.innerHTML='<div class="photo-loading">写真・動画ストレージを開けませんでした</div>';
  }
}

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||""));
    reader.onerror=()=>reject(new Error("PHOTO_READ"));
    reader.readAsDataURL(blob);
  });
}
function imageFromBlob(blob){
  return new Promise(async (resolve,reject)=>{
    if(!blob){reject(new Error("PHOTO_EMPTY"));return}
    const loadFromSrc=(src,cleanup)=>new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>res({img,cleanup});
      img.onerror=()=>{try{cleanup?.()}catch{};rej(new Error("PHOTO_LOAD"))};
      img.src=src;
    });
    try{
      const url=URL.createObjectURL(blob);
      resolve(await loadFromSrc(url,()=>{try{URL.revokeObjectURL(url)}catch{}}));
      return;
    }catch{}
    try{
      const dataUrl=await blobToDataUrl(blob);
      resolve(await loadFromSrc(dataUrl,()=>{}));
      return;
    }catch(e){reject(e)}
  });
}
function drawImageCover(ctx,img,x,y,w,h){
  const iw=img.naturalWidth||img.videoWidth||img.width,ih=img.naturalHeight||img.videoHeight||img.height;
  if(!iw||!ih||!w||!h)return;
  const scale=Math.max(w/iw,h/ih),dw=iw*scale,dh=ih*scale,dx=x+(w-dw)/2,dy=y+(h-dh)/2;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();
}
async function drawBlobCover(ctx,blob,x,y,w,h){
  if(!blob)return false;
  try{
    const dataUrl=await blobToDataUrl(blob);
    await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>{try{drawImageCover(ctx,img,x,y,w,h);resolve()}catch(e){reject(e)}};
      img.onerror=()=>reject(new Error("PHOTO_LOAD"));
      img.src=dataUrl;
    });
    return true;
  }catch(e){}
  try{
    const loaded=await imageFromBlob(blob);
    drawImageCover(ctx,loaded.img,x,y,w,h);
    try{loaded.cleanup?.()}catch{}
    return true;
  }catch(e){
    if(typeof createImageBitmap==="function"){
      try{
        const bmp=await createImageBitmap(blob);
        drawImageCover(ctx,bmp,x,y,w,h);
        try{bmp.close?.()}catch{}
        return true;
      }catch(err){}
    }
    return false;
  }
}
function showPhotoThumbLoadError(wrapEl,text="画像を再読み込みしてください"){
  if(!wrapEl)return;

async function bindBlobToImageElement(imgEl,blob,wrapEl=null){
  if(!imgEl||!blob)return false;

  try{

    imgEl.src=dataUrl;

async function buildPhotoExportCanvasesFromRoomItems(roomEntries){
  const out=[];
  for(const entry of roomEntries){
    const list=(entry.items||[]).slice();
    if(!list.length)continue;
    const displayRoom=entry.displayRoom||entry.roomName||'写真・動画';
    const probeBase=exportCanvasBase('写真・動画',displayRoom,1700);
    const layout=photoCanvasLayout(probeBase);
    const pages=createPhotoPagePlan(list,layout);
    const pageCount=pages.length||1;
    for(let pageIndex=0;pageIndex<pageCount;pageIndex++){
      const subtitle=pageCount>1?`${displayRoom}　${pageIndex+1}/${pageCount}`:displayRoom;
      const base=exportCanvasBase('写真・動画',subtitle,1700),{c,ctx}=base;
      c._appA4Page=true;
      const cfg=photoCanvasLayout(base);
      const pageItems=createPhotoPagePlan(list,cfg)[pageIndex]||[];
      for(const item of pageItems){
        const rec=item.rec;
        const previewBlob=rec.previewBlob||null;
        const previewSrc=rec.previewSrc||'';
        const isVideo=(rec.mediaType||mediaTypeOf(rec))==='video';
        const mediaPad=14;
        const stage=photoStageOf(rec);
        const boxW=item.w-mediaPad*2;
        const lineLimit=item.size==='1/2'?4:3;
        ctx.font='600 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
        const lines=photoTextLines(ctx,rec,boxW-6,lineLimit);
        const lineCount=Math.max(lines.length,1);
        const textBlockH=18+lineCount*22;
        // 1/6=1ページ6枚、1/3=1ページ3枚、1/2=1ページ2枚。
        // 割り当てたページ領域をカード全体で使うことで、サイズ差を明確にする。
        const cardH=item.h;
        const imgAreaH=Math.max(120,cardH-mediaPad-textBlockH-16);
        roundedRect(ctx,item.x,item.y,item.w,cardH,18,'#faf8f6');
        roundedRect(ctx,item.x+mediaPad,item.y+mediaPad,boxW,imgAreaH,12,'#eeeae7');
        let drewMedia=false;
        if(previewSrc)drewMedia=await drawSrcCover(ctx,previewSrc,item.x+mediaPad,item.y+mediaPad,boxW,imgAreaH);
        if(!drewMedia&&previewBlob)drewMedia=await drawBlobCover(ctx,previewBlob,item.x+mediaPad,item.y+mediaPad,boxW,imgAreaH);
        if(!drewMedia){
          ctx.fillStyle='#6f6862';
          ctx.font='700 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
          ctx.fillText('画像を再読み込みしてください',item.x+mediaPad+18,item.y+mediaPad+34);
        }
        if(isVideo){
          roundedRect(ctx,item.x+mediaPad+10,item.y+mediaPad+10,108,34,17,'rgba(0,0,0,.68)');
          ctx.fillStyle='#fff';ctx.font='800 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
          ctx.fillText('🎥 動画',item.x+mediaPad+27,item.y+mediaPad+33);
        }
        lines.forEach((line,li)=>{
          ctx.fillStyle=li===0&&stage!=='unset'&&line===`[${photoStageLabel(stage)}]`?'#6d655f':'#5e5751';
          ctx.font=(li===0&&stage!=='unset'&&line===`[${photoStageLabel(stage)}]`)?'800 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif':'600 17px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
          ctx.fillText(line,item.x+mediaPad+3,item.y+mediaPad+imgAreaH+24+li*22);
        });
      }
      out.push(c);
    }
  }
  return out;
}

function ensureGlueChecks(siteObj=state){
  if(!siteObj.glueChecks||typeof siteObj.glueChecks!=="object"||Array.isArray(siteObj.glueChecks))siteObj.glueChecks={};
  return siteObj.glueChecks;
}
function glueMeasureKey(roomObj,sec,m){
  return `${roomObj.id}|${sec.id}|${m.id}`;
}
function glueUsefulRooms(siteObj=state){
  return (siteObj.rooms||[]).filter(r=>(r.sections||[]).some(sec=>(sec.measures||[]).some(m=>String(m.value||"").trim())));
}
function glueDoneQty(checks,key,totalQty){
  const raw=checks[key];
  if(raw===true)return totalQty; // v2.4.26 のチェック済みデータを引き継ぐ
  const n=Number(raw);
  if(!Number.isFinite(n)||n<=0)return 0;
  return Math.max(0,Math.min(totalQty,Math.floor(n)));
}
function setGlueDoneQty(checks,key,qty,totalQty){
  const n=Math.max(0,Math.min(totalQty,Math.floor(Number(qty)||0)));
  if(n<=0)delete checks[key];
  else checks[key]=n;
}
function glueSummary(siteObj=state){
  const checks=ensureGlueChecks(siteObj);
  let totalM=0,doneM=0;
  const byProduct=new Map();
  glueUsefulRooms(siteObj).forEach(r=>(r.sections||[]).forEach(sec=>{
    const rv=effectiveWallRepeatV(sec,siteObj);
    const product=String(effectiveWallProduct(sec,siteObj)||"").trim()||"品番未入力";
    if(!byProduct.has(product))byProduct.set(product,{product,totalM:0,doneM:0,remainingM:0});
    const ps=byProduct.get(product);
    (sec.measures||[]).forEach(m=>{
      if(!String(m.value||"").trim())return;
      const c=calc(m.value,rv);if(!c)return;
      const key=glueMeasureKey(r,sec,m);
      const doneQty=glueDoneQty(checks,key,c.qty);
      const measureDoneM=(c.each*doneQty)/100;
      totalM+=c.withM;
      doneM+=measureDoneM;
      ps.totalM+=c.withM;
      ps.doneM+=measureDoneM;
    });
  }));
  const remainingM=Math.max(0,totalM-doneM);
  const products=[...byProduct.values()].map(x=>({...x,remainingM:Math.max(0,x.totalM-x.doneM)}));
  return {totalM,doneM,remainingM,products};
}
function refreshGlueSummary(wrap){
  const s=glueSummary(state);
  const total=wrap?.querySelector(".glue-total-m");
  const remain=wrap?.querySelector(".glue-remaining-m");
  if(total)total.textContent=fmt(s.totalM);
  if(remain)remain.textContent=fmt(s.remainingM);
}
function closeGlueQtyEditor(apply=false){
  const sheet=$("#glueQtySheet"),kp=$("#measureKeypad");
  if(apply&&activeGlueQtyKey){
    const n=Math.max(0,Math.min(activeGlueQtyTotal,Math.floor(Number(glueQtyDraft.value)||0)));
    setGlueDoneQty(ensureGlueChecks(state),activeGlueQtyKey,n,activeGlueQtyTotal);save();
  }
  if(sheet){sheet.classList.remove("show");sheet.setAttribute("aria-hidden","true")}
  if(kp)kp.classList.remove("glue-qty-mode");
  hideMeasureKeypad();activeGlueQtyKey=null;activeGlueQtyTotal=0;glueQtyDraft={value:""};
  if(apply)renderGluePage();
}
function openGlueQtyEditor(key,current,total){
  activeGlueQtyKey=key;activeGlueQtyTotal=total;glueQtyDraft={value:String(current)};
  const sheet=$("#glueQtySheet"),inp=$("#glueQtyInput");
  $("#glueQtyLimit").textContent=`0〜${total}枚`;
  sheet.classList.add("show");sheet.setAttribute("aria-hidden","false");
  inp.textContent=glueQtyDraft.value;
  showGenericNumberKeypad(inp,glueQtyDraft,"value","糊付け枚数",()=>{
    let n=Math.floor(Number(glueQtyDraft.value)||0);if(n>total){glueQtyDraft.value=String(total);numberCursor=glueQtyDraft.value.length;renderNumberCursor()}
  },null,()=>closeGlueQtyEditor(true));
  $("#measureKeypad")?.classList.add("glue-qty-mode");
}

function renderGluePage(){
  const area=$("#gluePageArea");if(!area)return;
  const checks=ensureGlueChecks(state);
  const rooms=glueUsefulRooms(state);
  if(!rooms.length){
    area.innerHTML='<div class="glue-page"><div class="glue-page-title">糊付け</div><div class="glue-page-empty">クロスの採寸データがありません</div></div>';
    return;
  }
  const summary=glueSummary(state);
  const wrap=document.createElement("div");
  wrap.className="glue-page";
  const productSummaryHtml=(summary.products||[]).map(ps=>`<div class="glue-product-column"><div class="glue-summary-box"><span>${esc(ps.product)} 合計</span><strong>${fmt(ps.totalM)}</strong></div><div class="glue-summary-box"><span>${esc(ps.product)} 残り</span><strong>${fmt(ps.remainingM)}</strong></div></div>`).join("");
  wrap.innerHTML=`<div class="glue-page-top"><div class="glue-summary"><div class="glue-summary-fixed"><div class="glue-summary-box"><span>現場合計</span><strong class="glue-total-m">${fmt(summary.totalM)}</strong></div><div class="glue-summary-box"><span>残り</span><strong class="glue-remaining-m">${fmt(summary.remainingM)}</strong></div></div><div class="glue-product-scroll"><div class="glue-product-columns">${productSummaryHtml}</div></div></div><button type="button" class="glue-page-reset">チェックを全解除</button></div><div class="glue-room-list"></div>`;
  const glueTop=wrap.querySelector(".glue-page-top");
  const syncGlueStickyHeight=()=>{
    if(glueTop)wrap.style.setProperty("--glue-sticky-height",`${Math.ceil(glueTop.getBoundingClientRect().height)}px`);
  };
  requestAnimationFrame(syncGlueStickyHeight);
  if(typeof ResizeObserver!=="undefined"&&glueTop){
    const glueStickyObserver=new ResizeObserver(syncGlueStickyHeight);
    glueStickyObserver.observe(glueTop);
  }
  wrap.querySelector(".glue-page-reset").onclick=()=>{
    if(!confirm("糊付けのチェック・途中枚数をすべて0に戻しますか？"))return;
    state.glueChecks={};save();renderGluePage();
  };
  const list=wrap.querySelector(".glue-room-list");

  rooms.forEach(r=>{
    const roomEl=document.createElement("section");roomEl.className="glue-room";
    const title=document.createElement("h3");title.className="glue-room-title";title.textContent=r.name;roomEl.appendChild(title);

    (r.sections||[]).forEach(sec=>{
      const measures=(sec.measures||[]).filter(m=>String(m.value||"").trim());
      if(!measures.length)return;
      const rv=effectiveWallRepeatV(sec,state),rh=effectiveWallRepeatH(sec,state),prod=effectiveWallProduct(sec,state);
      const secEl=document.createElement("div");secEl.className="glue-section";
      const head=document.createElement("div");head.className="glue-section-head";
      head.innerHTML=`<span class="glue-section-name">${esc(sec.name)}</span>${prod?`<span class="glue-product">${esc(prod)}</span>`:""}${rv?`<span class="glue-repeat">↕︎${esc(rv)}</span>`:""}${rh?`<span class="glue-repeat">↔︎${esc(rh)}</span>`:""}`;
      secEl.appendChild(head);

      measures.forEach(m=>{
        const key=glueMeasureKey(r,sec,m);
        const c=calc(m.value,rv);
        if(!c)return;
        const cut=cutDisplay(m.value,rv);
        const diff=cutDifference(m.value,rv);
        const doneQty=glueDoneQty(checks,key,c.qty);
        const checked=doneQty>=c.qty;
        const partial=doneQty>0&&!checked;

        const row=document.createElement("div");
        row.className="glue-row"+(checked?" checked":"")+(partial?" partial":"");
        row.innerHTML=`<button type="button" class="glue-check" aria-label="${checked?"チェックを外す":"すべて完了にする"}">${checked?"✓":""}</button><div class="glue-original">${esc(m.value)}</div><div class="glue-arrow">${cut?"→":""}</div><div class="glue-cut">${cut?esc(cut):""}</div><div class="glue-diff">${diff?esc(diff):""}</div><div class="glue-meter">${fmt(c.withM)}</div>${c.qty>1?`<button type="button" class="glue-qty-btn">${doneQty} / ${c.qty}<small>残り ${c.qty-doneQty}枚</small></button>`:""}`;

        const btn=row.querySelector(".glue-check");
        btn.onclick=()=>{
          const now=glueDoneQty(checks,key,c.qty);
          setGlueDoneQty(checks,key,now>=c.qty?0:c.qty,c.qty);
          save();
          renderGluePage();
        };

        const qtyBtn=row.querySelector(".glue-qty-btn");
        if(qtyBtn){
          qtyBtn.onclick=()=>{
            const current=glueDoneQty(checks,key,c.qty);
            openGlueQtyEditor(key,current,c.qty);
          };
        }
        secEl.appendChild(row);
      });
      roomEl.appendChild(secEl);
    });
    list.appendChild(roomEl);
  });

  area.innerHTML="";
  area.appendChild(wrap);
}


function ensureAreaCalc(siteObj=state){
  if(!siteObj.areaCalc||typeof siteObj.areaCalc!=="object")siteObj.areaCalc={items:[]};
  if(!Array.isArray(siteObj.areaCalc.items))siteObj.areaCalc.items=[];
  siteObj.areaCalc.items.forEach(x=>{
    if(!x.id)x.id="area-"+uid();
    if(!x.type)x.type="rect";
    if(x.sign!==-1)x.sign=1;
    if(typeof x.name!=="string")x.name="";
    if(!x.values||typeof x.values!=="object")x.values={};
    if(!x.triMode)x.triMode="bh";
    if(!x.circleMode)x.circleMode="circumference";
    if(typeof x.expression!=="string")x.expression="";
  });
  return siteObj.areaCalc;
}
function areaNum(v){const n=parseFloat(String(v??"").replace(",","."));return Number.isFinite(n)?n:NaN}
function areaValue(item){
  const v=item.values||{},cm2ToM2=x=>x/10000;
  if(item.type==="rect"){
    const a=areaNum(v.a),b=areaNum(v.b);return Number.isFinite(a)&&Number.isFinite(b)?cm2ToM2(a*b):NaN;
  }
  if(item.type==="triangle"){
    if(item.triMode==="sss"){
      const a=areaNum(v.a),b=areaNum(v.b),c=areaNum(v.c);
      if(![a,b,c].every(Number.isFinite)||a<=0||b<=0||c<=0||a+b<=c||a+c<=b||b+c<=a)return NaN;
      const sp=(a+b+c)/2;return cm2ToM2(Math.sqrt(sp*(sp-a)*(sp-b)*(sp-c)));
    }
    const a=areaNum(v.base),h=areaNum(v.height);return Number.isFinite(a)&&Number.isFinite(h)?cm2ToM2(a*h/2):NaN;
  }
  if(item.type==="trapezoid"){
    const a=areaNum(v.top),b=areaNum(v.bottom),h=areaNum(v.height);return [a,b,h].every(Number.isFinite)?cm2ToM2((a+b)*h/2):NaN;
  }
  if(item.type==="arc"){
    const c=areaNum(v.chord),h=areaNum(v.sagitta);
    if(!Number.isFinite(c)||!Number.isFinite(h)||c<=0||h<=0)return NaN;
    const r=(c*c)/(8*h)+h/2;
    if(!Number.isFinite(r)||r<=0||h>2*r)return NaN;
    const ratio=Math.max(-1,Math.min(1,(r-h)/r));
    const theta=2*Math.acos(ratio);
    const segCm2=0.5*r*r*(theta-Math.sin(theta));
    return cm2ToM2(segCm2);
  }
  if(item.type==="circle"){
    const x=areaNum(v.circle);if(!Number.isFinite(x)||x<0)return NaN;
    let r=item.circleMode==="radius"?x:item.circleMode==="diameter"?x/2:x/(2*Math.PI);
    return cm2ToM2(Math.PI*r*r);
  }
  if(item.type==="free"){
    let exp=String(item.expression||"").trim();if(!exp)return NaN;
    exp=exp.replace(/[×xX]/g,"*").replace(/[÷]/g,"/").replace(/[＋]/g,"+").replace(/[−ー]/g,"-").replace(/，/g,",");
    if(!/^[0-9+\-*/().\s]+$/.test(exp))return NaN;
    try{const val=Function('"use strict";return ('+exp+')')();return Number.isFinite(val)?val/10000:NaN}catch{return NaN}
  }
  return NaN;
}
function areaDerivedInfo(item){
  const v=item.values||{};
  if(item.type==="arc"){
    const c=areaNum(v.chord),h=areaNum(v.sagitta);
    if(!Number.isFinite(c)||!Number.isFinite(h)||c<=0||h<=0)return [];
    const r=(c*c)/(8*h)+h/2;
    if(!Number.isFinite(r)||r<=0||h>2*r)return [];
    const center=Math.abs(r-h);
    const side=Math.abs(r-h)<0.005?"弦上":(h>r?"円弧側":"円弧の反対側");
    return [`半径 ${r.toFixed(2)}cm`,`直径 ${(r*2).toFixed(2)}cm`,`中心まで ${center.toFixed(2)}cm（${side}）`];
  }
  if(item.type==="circle"){
    const x=areaNum(v.circle);if(!Number.isFinite(x)||x<0)return [];
    const r=item.circleMode==="radius"?x:item.circleMode==="diameter"?x/2:x/(2*Math.PI);
    const d=r*2;
    return [`半径 ${r.toFixed(2)}cm`,`直径 ${d.toFixed(2)}cm`];
  }
  if(item.type==="triangle"&&item.triMode==="sss"){
    const base=areaNum(v.a),b=areaNum(v.b),c=areaNum(v.c);
    if(![base,b,c].every(Number.isFinite)||base<=0||b<=0||c<=0||base+b<=c||base+c<=b||b+c<=base)return [];
    const sp=(base+b+c)/2;
    const areaCm2=Math.sqrt(sp*(sp-base)*(sp-b)*(sp-c));
    const h=2*areaCm2/base;
    return [`高さ ${h.toFixed(2)}cm`];
  }
  return [];
}
function areaFormulaText(item){
  const v=item.values||{},show=x=>String(x||"?");
  if(item.type==="rect")return `${show(v.a)} × ${show(v.b)} ÷ 10000`;
  if(item.type==="triangle"&&item.triMode==="sss")return `底辺 ${show(v.a)} / 辺① ${show(v.b)} / 辺② ${show(v.c)} cm`;
  if(item.type==="triangle")return `${show(v.base)} × ${show(v.height)} ÷ 2 ÷ 10000`;
  if(item.type==="trapezoid")return `(${show(v.top)} + ${show(v.bottom)}) × ${show(v.height)} ÷ 2 ÷ 10000`;
  if(item.type==="arc")return `弦 ${show(v.chord)} × 矢高 ${show(v.sagitta)} cm`;
  if(item.type==="circle")return `${item.circleMode==="radius"?"半径":item.circleMode==="diameter"?"直径":"円周"} ${show(v.circle)} cm`;
  if(item.type==="free")return item.expression?`${item.expression} cm² ÷ 10000`:"式を入力";
  return "";
}
function areaTypeLabel(t){return t==="rect"?"□ 長方形":t==="triangle"?"△ 三角形":t==="trapezoid"?"台形":t==="circle"?"○ 円":t==="arc"?"⌒ 円弧":"自由計算"}
function newAreaItem(type="rect"){
  return {id:"area-"+uid(),name:"",type,sign:1,triMode:"bh",circleMode:"circumference",values:{},expression:""};
}
function areaField(label,key,item,placeholder="cm"){
  const val=String(item.values?.[key]||"");
  return `<div class="area-field"><label>${esc(label)}</label><button type="button" class="area-num-btn ${val?"":"empty"}" data-area-key="${esc(key)}" data-placeholder="${esc(placeholder)}">${esc(val||placeholder)}</button></div>`;
}
function areaInputKeys(item){
  if(item.type==="rect")return ["a","b"];
  if(item.type==="triangle")return item.triMode==="sss"?["a","b","c"]:["base","height"];
  if(item.type==="trapezoid")return ["top","bottom","height"];
  if(item.type==="circle")return ["circle"];
  if(item.type==="arc")return ["chord","sagitta"];
  return [];
}
function moveToNextAreaField(itemId,currentKey){
  const data=ensureAreaCalc(state),idx=data.items.findIndex(x=>x.id===itemId);
  if(idx<0){hideMeasureKeypad();return}
  const item=data.items[idx],keys=areaInputKeys(item),keyIndex=keys.indexOf(currentKey);
  if(keyIndex>=0&&keyIndex<keys.length-1){
    const nextKey=keys[keyIndex+1];
    const card=document.querySelector(`.area-item[data-area-id="${itemId}"]`);
    const nextBtn=card?.querySelector(`[data-area-key="${nextKey}"]`);
    if(nextBtn){showGenericNumberKeypad(nextBtn,item.values,nextKey,"面積寸法",()=>{renderAreaPage()},null,()=>moveToNextAreaField(itemId,nextKey));return}
  }
  // 同じカードの最後なら、次のカードに数値入力欄があればそこへ進む。
  for(let i=idx+1;i<data.items.length;i++){
    const nextItem=data.items[i],nextKeys=areaInputKeys(nextItem);
    if(!nextKeys.length)continue;
    const nextKey=nextKeys[0];
    const card=document.querySelector(`.area-item[data-area-id="${nextItem.id}"]`);
    const nextBtn=card?.querySelector(`[data-area-key="${nextKey}"]`);
    if(nextBtn){showGenericNumberKeypad(nextBtn,nextItem.values,nextKey,"面積寸法",()=>{renderAreaPage()},null,()=>moveToNextAreaField(nextItem.id,nextKey));return}
  }
  hideMeasureKeypad();
}
function renderAreaPage(){
  const area=$("#areaPageArea");if(!area)return;
  const data=ensureAreaCalc(state),items=data.items;
  const total=items.reduce((sum,it)=>{const a=areaValue(it);return Number.isFinite(a)?sum+(it.sign||1)*a:sum},0);
  area.innerHTML=`<div class="area-calc-wrap">
    <div class="area-calc-head"><div><div class="area-calc-title">面積計算</div><div class="area-calc-note">寸法はcm入力。各項目を＋ / −で合計します。</div></div><div class="area-calc-total"><span>合計面積</span><strong>${total.toFixed(2)}㎡</strong></div></div>
    <div class="area-shape-tools"><button data-area-add="rect">□ 長方形</button><button data-area-add="triangle">△ 三角形</button><button data-area-add="trapezoid">台形</button><button data-area-add="circle">○ 円</button><button data-area-add="arc">⌒ 円弧</button><button data-area-add="free">自由計算</button></div>
    <div id="areaItems"></div>
    <div class="area-shape-tools area-shape-tools-bottom"><button data-area-add="rect">□ 長方形</button><button data-area-add="triangle">△ 三角形</button><button data-area-add="trapezoid">台形</button><button data-area-add="circle">○ 円</button><button data-area-add="arc">⌒ 円弧</button><button data-area-add="free">自由計算</button></div>
  </div>`;
  const list=area.querySelector("#areaItems");
  if(!items.length)list.innerHTML='<div class="area-empty">上の図形を押して計算を追加してください</div>';
  items.forEach((item,index)=>{
    const result=areaValue(item),card=document.createElement("div");card.className="area-item";card.dataset.areaId=item.id;
    const types=[["rect","□ 長方形"],["triangle","△ 三角形"],["trapezoid","台形"],["circle","○ 円"],["arc","⌒ 円弧"],["free","自由計算"]];
    let extra="";
    if(item.type==="triangle")extra=`<div class="area-submode"><button data-tri-mode="bh" class="${item.triMode!=="sss"?"active":""}">底辺×高さ</button><button data-tri-mode="sss" class="${item.triMode==="sss"?"active":""}">3辺から</button></div>`;
    if(item.type==="circle")extra=`<div class="area-submode"><button data-circle-mode="circumference" class="${item.circleMode==="circumference"?"active":""}">円周</button><button data-circle-mode="diameter" class="${item.circleMode==="diameter"?"active":""}">直径</button><button data-circle-mode="radius" class="${item.circleMode==="radius"?"active":""}">半径</button></div>`;
    let fields="";
    if(item.type==="rect")fields=areaField("縦",'a',item)+areaField("横",'b',item);
    else if(item.type==="triangle"&&item.triMode==="sss")fields=areaField("底辺",'a',item)+areaField("辺①",'b',item)+areaField("辺②",'c',item);
    else if(item.type==="triangle")fields=areaField("底辺",'base',item)+areaField("高さ",'height',item);
    else if(item.type==="trapezoid")fields=areaField("上底",'top',item)+areaField("下底",'bottom',item)+areaField("高さ",'height',item);
    else if(item.type==="circle")fields=areaField(item.circleMode==="radius"?"半径":item.circleMode==="diameter"?"直径":"円周",'circle',item);
    else if(item.type==="arc")fields=areaField("弦の幅",'chord',item)+areaField("矢高",'sagitta',item);
    else fields=`<div class="area-field"><label>式（cm）</label><button type="button" class="area-free-input ${item.expression?"":"empty"}" data-area-expression data-placeholder="例：320×245+180×120÷2">${esc(item.expression?item.expression.replace(/\*/g,"×").replace(/\//g,"÷"):"例：320×245+180×120÷2")}</button><div class="area-free-help">＋ − × ÷（ ）を専用テンキーから入力できます</div></div>`;
    card.innerHTML=`<div class="area-item-head"><button class="area-sign ${item.sign===-1?"minus":""}" title="加算・減算">${item.sign===-1?"−":"＋"}</button><input class="area-name" value="${esc(item.name||"")}" placeholder="例：LDK① / 柱型"><button class="area-delete">削除</button></div>
      <div class="area-type-row">${types.map(([k,l])=>`<button data-area-type="${k}" class="${item.type===k?"active":""}">${l}</button>`).join("")}</div>${extra}<div class="area-fields">${fields}</div>
      <div class="area-formula-line"><div class="area-formula">${esc(areaFormulaText(item))}</div><div class="area-result">${Number.isFinite(result)?(item.sign===-1?"−":"")+result.toFixed(3)+"㎡":"—"}</div></div>
      ${areaDerivedInfo(item).length?`<div class="area-derived">${areaDerivedInfo(item).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}`;
    card.querySelector(".area-sign").onclick=()=>{item.sign=item.sign===-1?1:-1;save();renderAreaPage()};
    card.querySelector(".area-name").oninput=e=>{item.name=e.target.value;save()};
    card.querySelector(".area-delete").onclick=()=>{data.items=data.items.filter(x=>x.id!==item.id);save();renderAreaPage()};
    card.querySelectorAll("[data-area-type]").forEach(b=>b.onclick=()=>{item.type=b.dataset.areaType;save();renderAreaPage()});
    card.querySelectorAll("[data-tri-mode]").forEach(b=>b.onclick=()=>{item.triMode=b.dataset.triMode;save();renderAreaPage()});
    card.querySelectorAll("[data-circle-mode]").forEach(b=>b.onclick=()=>{item.circleMode=b.dataset.circleMode;save();renderAreaPage()});
    card.querySelectorAll("[data-area-key]").forEach(btn=>{
      btn.onclick=()=>{
        const key=btn.dataset.areaKey;
        showGenericNumberKeypad(btn,item.values,key,"面積寸法",()=>{renderAreaPage()},null,()=>moveToNextAreaField(item.id,key));
      };
    });
    const free=card.querySelector(".area-free-input");if(free)free.onclick=()=>{
      showFormulaKeypad(free,item,"expression","自由計算",()=>{
        const r=areaValue(item);
        card.querySelector(".area-formula").textContent=areaFormulaText(item).replace(/\*/g,"×").replace(/\//g,"÷");
        card.querySelector(".area-result").textContent=Number.isFinite(r)?(item.sign===-1?"−":"")+r.toFixed(3)+"㎡":"—";
        const t=data.items.reduce((sum,it)=>{const a=areaValue(it);return Number.isFinite(a)?sum+(it.sign||1)*a:sum},0);
        area.querySelector(".area-calc-total strong").textContent=t.toFixed(2)+"㎡";
      });
    };
    list.appendChild(card);
  });
  area.querySelectorAll("[data-area-add]").forEach(b=>b.onclick=()=>{data.items.push(newAreaItem(b.dataset.areaAdd));save();renderAreaPage();setTimeout(()=>area.querySelectorAll('.area-item')[data.items.length-1]?.scrollIntoView({behavior:'smooth',block:'center'}),20)});
}

function bindMeasureDrag(handle,row,sec,m){
  if(!handle||handle.dataset.dragBound==="1")return;
  handle.dataset.dragBound="1";
  handle.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();hideMeasureKeypad();hideProductKeypad();
    handle.setPointerCapture?.(e.pointerId);
    let targetId=null,targetRow=null;
    const move=ev=>{
      document.querySelectorAll(".measure-row.drop-target").forEach(x=>x.classList.remove("drop-target"));
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const tr=el?.closest?.(".measure-row");
      if(tr&&tr!==row&&tr.dataset.mid){
        targetId=tr.dataset.mid;targetRow=tr;tr.classList.add("drop-target");
      }
    };
    const up=()=>{
      targetRow?.classList.remove("drop-target");
      handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);handle.removeEventListener("pointercancel",up);
      if(targetId){
        const from=sec.measures.findIndex(x=>x.id===m.id),to=sec.measures.findIndex(x=>x.id===targetId);
        if(from>=0&&to>=0&&from!==to){
          const [item]=sec.measures.splice(from,1);
          sec.measures.splice(to,0,item);
          save();render();
        }
      }
    };
    handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);handle.addEventListener("pointercancel",up);
  });
}

// 共通タップ判定：指が動いた場合はスワイプとして扱い、入力・選択を開始しない
function bindTapOnly(el,handler,threshold=10){
  if(!el)return;
  let sx=0,sy=0,moved=false,suppressClick=false;
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;
    sx=e.clientX;sy=e.clientY;moved=false;
  },{passive:true});
  el.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse")return;
    if(Math.abs(e.clientX-sx)>threshold||Math.abs(e.clientY-sy)>threshold)moved=true;
  },{passive:true});
  el.addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse")return;
    suppressClick=true;
    setTimeout(()=>{suppressClick=false},350);
    if(moved)return;
    e.preventDefault();
    handler(e);
  });
  el.addEventListener("pointercancel",()=>{moved=true});
  el.addEventListener("click",e=>{
    if(suppressClick)return;
    e.preventDefault();
    handler(e);
  });
}

    if(e.pointerType==="mouse")return;

  },{passive:true});
  inp.addEventListener("pointerup",e=>{

function sectionGroups(siteObj=state){

async function canvasToPdfJpegs(canvas){

  }
  return out;
}
function makePdfFromJpegs(images){
  const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;
  const pushText=s=>{const b=enc.encode(s);chunks.push(b);length+=b.length};
  const pushBytes=b=>{chunks.push(b);length+=b.length};
  const objStart=n=>{offsets[n]=length;pushText(`${n} 0 obj\n`)};
  const objEnd=()=>pushText(`endobj\n`);
  const A4W=595.28,A4H=841.89;
  const pageObjs=images.map((_,i)=>3+i*3),objCount=2+images.length*3;
  pushText("%PDF-1.4\n%PDFGEN\n");
  objStart(1);pushText("<< /Type /Catalog /Pages 2 0 R >>\n");objEnd();
  objStart(2);pushText(`<< /Type /Pages /Count ${images.length} /Kids [${pageObjs.map(n=>`${n} 0 R`).join(" ")}] >>\n`);objEnd();

  images.forEach((im,i)=>{
    const pageObj=3+i*3,imageObj=pageObj+1,contentObj=pageObj+2;
    const original=!!im.originalPdfPage;
    const pageW=original?Number(im.pageW)||A4W:A4W;
    const pageH=original?Number(im.pageH)||A4H:A4H;
    const margin=original?0:18;

    let drawW,drawH,x,y;
    if(original){
      // 図面は元PDFのページサイズ・縦横・比率をそのまま維持。
      drawW=pageW;drawH=pageH;x=0;y=0;
    }else{
      // アプリ生成ページはA4縦に統一。
      const scale=Math.min((pageW-margin*2)/im.width,(pageH-margin*2)/im.height);
      drawW=im.width*scale;drawH=im.height*scale;
      x=(pageW-drawW)/2;y=(pageH-drawH)/2;
    }

    const content=`q\n${drawW.toFixed(3)} 0 0 ${drawH.toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)} cm\n/Im0 Do\nQ\n`,cb=enc.encode(content);
    objStart(pageObj);
    pushText(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(3)} ${pageH.toFixed(3)}] /Resources << /XObject << /Im0 ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>\n`);
    objEnd();

    objStart(imageObj);
    pushText(`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    pushBytes(im.bytes);pushText("\nendstream\n");objEnd();

    objStart(contentObj);
    pushText(`<< /Length ${cb.length} >>\nstream\n`);pushBytes(cb);pushText("endstream\n");objEnd();
  });

  const xref=length;
  pushText(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);
  for(let n=1;n<=objCount;n++)pushText(`${String(offsets[n]).padStart(10,"0")} 00000 n \n`);
  pushText(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob([concatUint8(chunks)],{type:"application/pdf"});
}
async function buildRoomsPdfFile(siteObj,rooms,fileName,includeSiteTotal=false){

function orderExportSegments(item){
  if(item.mode!=="cuts")return [{item,cuts:null,continued:false,last:true,height:orderExportItemHeight(item)}];

  const cuts=item.cuts||[];
  // 1カードが1ページを超えないよう、長い寸法一覧だけ分割。
  // 2列×最大16行 = 32寸法/カード。
  const maxCuts=32;
  if(cuts.length<=maxCuts)return [{item,cuts,continued:false,last:true,height:orderExportItemHeight(item)}];

  const out=[];
  for(let i=0;i<cuts.length;i+=maxCuts){
    const chunk=cuts.slice(i,i+maxCuts),last=i+maxCuts>=cuts.length;
    out.push({

      height:orderExportItemHeight(item,chunk.length,last)

    left=pad+26;right=width-pad-26;contentW=right-left;
    pages.push(c);
  };
  const roundRectFill=(x,yy,w,h,r,fill,stroke=null)=>{
    ctx.beginPath();ctx.roundRect(x,yy,w,h,r);
    ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
  };
  const drawCategory=(label)=>{
    ctx.fillStyle="#2f2b28";
    ctx.font='800 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
    ctx.fillText(label,left,y);y+=48;
  };
  const ensureSpace=(need,label=null)=>{
    if(y+need<=bottomLimit)return;
    newPage();
    if(label)drawCategory(label);
  };
  const drawItemSegment=(segment,key)=>{
    const item=segment.item,cuts=segment.cuts,continued=segment.continued,last=segment.last;
    const cardH=segment.height;
    roundRectFill(left,y,contentW,cardH,18,"#fbfaf8","#e9e3de");

    let cy=y+28;
    const innerL=left+24,innerR=right-24;

    // クロスは品番が主役。
    // それ以外は「種類名を小さく薄く / 品番を大きく濃く」。
    if(key==="wall"){
      ctx.fillStyle="#332f2c";
      ctx.font='800 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.name}${continued?"（続き）":""}`,innerL,cy);
      cy+=38;
    }else if(item.product){
      ctx.fillStyle="#8a817a";
      ctx.font='700 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(item.name,innerL,cy);
      cy+=27;
      ctx.fillStyle="#332f2c";
      ctx.font='800 25px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.product}${continued?"（続き）":""}`,innerL,cy);
      cy+=40;
    }else{
      ctx.fillStyle="#332f2c";
      ctx.font='800 24px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(`${item.name}${continued?"（続き）":""}`,innerL,cy);
      cy+=38;
    }

    ctx.strokeStyle="#ece6e1";
    ctx.beginPath();ctx.moveTo(innerL,cy);ctx.lineTo(innerR,cy);ctx.stroke();
    cy+=22;

    if(item.mode==="cuts"){
      const useCuts=cuts||item.cuts||[];
      const colGap=28,colW=(innerR-innerL-colGap)/2;
      const rows=Math.ceil(useCuts.length/2);
      ctx.fillStyle="#45403c";
      ctx.font='750 20px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';

      for(let i=0;i<useCuts.length;i++){
        const row=Math.floor(i/2),col=i%2;
        const x=innerL+col*(colW+colGap);
        const yy=cy+row*48;
        const cut=useCuts[i];
        const len=orderFmtNum(cut.orderLength),cnt=orderFmtNum(cut.orderCount);
        ctx.strokeStyle="#6c645e";ctx.lineWidth=2;
        ctx.strokeRect(x,yy-17,20,20);
        ctx.fillStyle="#45403c";
        ctx.fillText(`${len}${cut.lengthUnit||"m"} × ${cnt}${cut.countUnit||"本"}`,x+34,yy);
      }
      cy+=rows*48+6;
    }else{
      ctx.strokeStyle="#6c645e";ctx.lineWidth=2;
      ctx.strokeRect(innerL,cy-17,22,22);
      ctx.fillStyle="#3e3935";
      ctx.font='800 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
      ctx.fillText(item.qtyText||"",innerL+38,cy+1);
      cy+=49;
    }

    // 部屋名・補足は分割カードの最後だけ表示
    if(last){
      if(item.mode==="wall"&&Array.isArray(item.roomTotals)&&item.roomTotals.length){
        const chips=item.roomTotals.map(x=>`${x.room} ${orderFmtNum(x.qty)}m`);
        let cx=innerL,rowY=cy;
        ctx.font='700 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
        chips.forEach(chip=>{
          const tw=ctx.measureText(chip).width+28;
          if(cx+tw>innerR){cx=innerL;rowY+=34}
          roundRectFill(cx,rowY-19,tw,28,9,"#f0ece8");
          ctx.fillStyle="#5d554f";ctx.fillText(chip,cx+14,rowY);
          cx+=tw+10;
        });
        cy=rowY+30;
      }else{
        const roomText=[...new Set(item.rooms||[])].join("・");
        if(roomText){
          ctx.fillStyle="#5d554f";
          ctx.font='800 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
          const rw=Math.min(innerR-innerL,ctx.measureText(roomText).width+30);
          roundRectFill(innerL,cy-19,rw,29,9,"#f0ece8");
          ctx.fillText(roomText,innerL+15,cy);cy+=36;
        }
      }
      if(item.detail){
        ctx.fillStyle="#8a817a";
        ctx.font='600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
        wrapCanvasText(ctx,item.detail,innerR-innerL).forEach(line=>{ctx.fillText(line,innerL,cy);cy+=23});
      }
    }
    y+=cardH+18;
  };

  newPage();

  defs.forEach(([key,label])=>{
    const items=data[key]||[];if(!items.length)return;
    ensureSpace(70);
    drawCategory(label);

    items.forEach(item=>{
      const segments=orderExportSegments(item);
      segments.forEach((segment,idx)=>{
        // カード単位でページ跨ぎを防止。
        ensureSpace(segment.height+18,label);
        drawItemSegment(segment,key);
      });
    });
    y+=8;
  });

  return pages;
}

async function drawingBlobHash(rec){
  try{
    const buf=await rec.blob.arrayBuffer();
    if(window.crypto?.subtle){
      const digest=await crypto.subtle.digest("SHA-256",buf);
      return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    // fallback: byte content checksum (still filename-independent)
    const a=new Uint8Array(buf);let h1=2166136261>>>0,h2=0;
    for(let i=0;i<a.length;i++){h1=Math.imul(h1^a[i],16777619)>>>0;h2=(h2+a[i]*(i+1))>>>0}
    return `${a.length}:${h1.toString(16)}:${h2.toString(16)}`;
  }catch(e){
    console.warn("drawing hash failed",e);
    return `fallback:${rec.id}`;
  }
}
function drawingInkScore(rec){
  try{
    const ink=memoEditorInkRec(rec.id);
    return (ink?.pageStrokes||[]).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  }catch{return 0}
}
async function uniqueDrawingRecords(records){
  const byHash=new Map();
  for(const rec of (records||[])){
    // ファイル名が違っても、PDF/画像の実データが同じなら同一図面として扱う。
    const hash=await drawingBlobHash(rec);
    const prev=byHash.get(hash);
    if(!prev){
      byHash.set(hash,rec);
      continue;
    }
    // 同じ実データが重複している場合は、手書きが多く残っている方を採用。
    if(drawingInkScore(rec)>drawingInkScore(prev))byHash.set(hash,rec);
  }
  return [...byHash.values()];
}

async function buildDrawingExportCanvases(siteObj=state,selectedIds=null){
  if(!window.pdfjsLib)throw new Error("pdfjs not loaded");
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const all=await uniqueDrawingRecords(await memoDbAllForSite(siteObj.id));
  const ids=Array.isArray(selectedIds)?new Set(selectedIds):null;
  const files=all.filter(f=>!ids||ids.has(f.id));
  const out=[];

  for(const rec of files){
    const isPdf=rec.isPdf||String(rec.mimeType||"").toLowerCase()==="application/pdf";
    const ink=memoEditorInkRec(rec.id);

    if(isPdf){
      try{
        // サムネ・画面キャッシュは一切使わず、保存されている元PDFを直接再描画。
        const bytes=new Uint8Array(await rec.blob.arrayBuffer());
        const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
        for(let pageIndex=0;pageIndex<pdf.numPages;pageIndex++){
          const pg=await pdf.getPage(pageIndex+1);
          const base=pg.getViewport({scale:1});
          const targetLong=2000;
          const scale=Math.max(1,Math.min(2.5,targetLong/Math.max(base.width,base.height)));
          const view=pg.getViewport({scale});
          const c=document.createElement("canvas");
          c.width=Math.max(1,Math.ceil(view.width));c.height=Math.max(1,Math.ceil(view.height));
          // 元PDFのMediaBox相当（PDF.js scale:1 は point 単位）を保持。
          c._pdfOriginalPage=true;
          c._pdfPageW=base.width;
          c._pdfPageH=base.height;
          const ctx=c.getContext("2d",{alpha:false});
          ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
          await pg.render({canvasContext:ctx,viewport:view}).promise;

          // 全画面エディタと同じ 0..1 のページ正規化座標を、元PDFページ全面へそのまま重ねる。
          const strokes=ink.pageStrokes?.[pageIndex]||[];
          if(strokes.length)editorCompositeStrokes(ctx,strokes,0,0,c.width,c.height);
          out.push(c);
        }
      }catch(e){console.error("original PDF drawing export",rec.fileName,e)}
    }else{
      try{
        // 画像もサムネではなく元画像を直接使用。
        const url=URL.createObjectURL(rec.blob);
        const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=url});
        const maxSide=2000,sc=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        const w=Math.max(1,Math.round((img.naturalWidth||img.width)*sc));
        const h=Math.max(1,Math.round((img.naturalHeight||img.height)*sc));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d",{alpha:false});
        ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        const strokes=ink.pageStrokes?.[0]||[];
        if(strokes.length)editorCompositeStrokes(ctx,strokes,0,0,w,h);
        out.push(c);
      }catch(e){console.error("original image drawing export",rec.fileName,e)}
    }
  }
  return out;
}

function areaExportFormula(item){
  const v=item.values||{},show=x=>String(x??"").trim()||"?";
  if(item.type==="rect")return `${show(v.a)} × ${show(v.b)} ÷ 10000`;
  if(item.type==="triangle"&&item.triMode==="sss")return `底辺 ${show(v.a)} / 辺① ${show(v.b)} / 辺② ${show(v.c)}`;
  if(item.type==="triangle")return `${show(v.base)} × ${show(v.height)} ÷ 2 ÷ 10000`;
  if(item.type==="trapezoid")return `(${show(v.top)} + ${show(v.bottom)}) × ${show(v.height)} ÷ 2 ÷ 10000`;
  if(item.type==="arc")return `弦 ${show(v.chord)} / 矢高 ${show(v.sagitta)}`;
  if(item.type==="circle")return `${item.circleMode==="radius"?"半径":item.circleMode==="diameter"?"直径":"円周"} ${show(v.circle)}`;
  if(item.type==="free")return String(item.expression||"").replace(/\*/g,"×").replace(/\//g,"÷");
  return areaFormulaText(item);
}

    ctx.textAlign="right";ctx.fillText(`${value.toFixed(2)}㎡`,resultX,y+36);ctx.textAlign="left";
    y+=rowH;

  y+=18;

  ctx.fillStyle="#8d3b3b";ctx.textAlign="left";ctx.fillText("− 合計",sx,y+78);
  ctx.textAlign="right";ctx.fillText(`${minus.toFixed(2)}㎡`,rv,y+78);
  ctx.fillStyle="#272522";ctx.font='900 28px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif';
  ctx.textAlign="left";ctx.fillText("合計数量",sx,y+126);
  ctx.textAlign="right";ctx.fillText(`${total.toFixed(2)}㎡`,rv,y+126);ctx.textAlign="left";
  return c;
}

async function buildSelectedExportCanvases(parts,siteObj=state){
  const canvases=[];

        // 現場まとめPDFでも、部屋PDFと同じ「区分単位」のページを使う。

      return out;
    });
  }
  if(parts.includes("floor"))safe("floor",()=>finishExportItems("floor",siteObj).length?buildFinishExportCanvas("floor",siteObj):null);
  if(parts.includes("sheet"))safe("sheet",()=>finishExportItems("sheet",siteObj).length?buildFinishExportCanvas("sheet",siteObj):null);
  if(parts.includes("other"))safe("other",()=>finishExportItems("other",siteObj).length?buildFinishExportCanvas("other",siteObj):null);
  if(parts.includes("switch")){
    try{canvases.push(...await buildSwitchExportCanvases(siteObj))}catch(e){console.error("switch export",e)}
  }
  if(parts.includes("photo")){
    try{canvases.push(...await buildPhotoExportCanvases(siteObj))}catch(e){console.error("photo export",e)}
  }
  if(parts.includes("memo")){
    try{canvases.push(...await buildMemoExportCanvases(siteObj,{excludeDrawings:true}))}catch(e){console.error("memo export",e)}
  }
  if(parts.includes("area"))safe("area",()=>buildAreaExportCanvas(siteObj));
  if(parts.includes("drawing")){
    try{
      const ids=selectedDrawingExportIds();
      if(ids.length)canvases.push(...await buildDrawingExportCanvases(siteObj,ids));
    }catch(e){console.error("drawing export",e)}
  }
  if(parts.includes("order")){
    safe("order",()=>{
      const od=collectOrderData(siteObj);
      return ["wall","floor","sheet","other"].some(k=>(od[k]||[]).length)?buildOrderExportCanvases(siteObj):[];

  return canvases.filter(Boolean);
}

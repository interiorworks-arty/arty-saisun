<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3f0">
<link rel="manifest" href="manifest.webmanifest">
<title>現調</title>
<style>
:root{--bg:#f5f3f0;--paper:#fff;--ink:#272522;--muted:#aaa39d;--line:#ddd7d2;--accent:#665f59;--soft:#eeeae6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(245,243,240,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 14px 11px}
.header-row{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}.title{font-size:23px;font-weight:800}.tag{font-size:11px;color:#8f8882}
main{max-width:760px;margin:auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
input,button{font:inherit}input{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);outline:none}input:focus{border-bottom-color:#91877f}
.site,.room-card,.calc-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.site input{width:100%;font-size:18px;font-weight:700;padding:7px 0}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px}.tab,.add-tab{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#e6e1dd;color:#383431;font-weight:700}.tab.active{background:var(--accent);color:#fff}
.add-tab{font-size:18px;padding:6px 13px}
.room-title{display:flex;justify-content:space-between;align-items:center}.room-title h2{margin:0;font-size:20px}.small-btn{border:0;background:transparent;color:#8b8179;padding:8px}
.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}
.section-head{display:grid;grid-template-columns:48px 1.35fr 1fr 24px;gap:7px;align-items:center}.category{font-weight:800;font-size:17px}
.placeholder-input{width:100%;font-size:14px;padding:7px 0}.placeholder-input::placeholder{color:#b2aaa4}.repeat-wrap{display:flex;align-items:center;gap:2px}.repeat-prefix{color:#938b84}
.measure-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:36px}.measure-input{width:100%;font-size:20px;font-weight:650;padding:5px 1px;border:0;background:transparent;text-align:left;color:var(--ink);min-height:34px}.measure-input.empty{color:#c4bdb7;font-weight:400}
.line-result{font-size:12px;color:#8b837d;white-space:nowrap}.section-totals{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#766f69}.section-totals strong{font-size:14px;color:var(--ink)}
.add-section{width:100%;border:0;background:#efebe8;color:#514a45;border-radius:12px;padding:12px;font-weight:700;margin-top:8px}
.totals{background:#efebe8;border-radius:14px;padding:13px;margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.total-box span{display:block;font-size:11px;color:#766f69}.total-box strong{display:block;font-size:22px;margin-top:2px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:760px;margin:auto;display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;background:#e9e4e0;color:#403a36}.bottom button.primary{background:var(--accent);color:white}
.calc-view{display:none}.calc-view.active{display:block}.edit-view.hidden{display:none}.calc-tabs{display:flex;gap:8px;margin-bottom:12px}.calc-tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:#ece8e5;font-weight:800}.calc-tabs button.active{background:var(--accent);color:white}
.calc-item{padding:11px 0;border-top:1px solid var(--line)}.calc-item:first-child{border-top:0}.calc-title{display:flex;justify-content:space-between;gap:10px;font-weight:800}.calc-sub{font-size:13px;color:#756e68;margin-top:5px;line-height:1.65}.grand{font-size:26px;font-weight:900;margin-top:8px}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:none;align-items:flex-end}.menu.show{display:flex}.sheet{background:white;width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:0;border-radius:11px;padding:13px 8px;background:#eeeae7;font-weight:800}.sheet input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0;font-size:16px}.sheet-actions{display:flex;gap:8px}.sheet-actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800}.primary2{background:var(--accent);color:#fff}.cancel{background:#eeeae7}.delete-section{border:0;background:transparent;color:#aaa29c;font-size:18px;padding:0}


.keypad{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));
  z-index:90;width:min(420px,calc(100% - 24px));
  background:rgba(255,255,255,.98);
  border:1px solid var(--line);border-radius:16px;
  padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.16);
  display:none;
}
.keypad.show{display:block}
.keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keypad button{
  border:0;border-radius:11px;background:#eeeae6;color:var(--ink);
  min-height:46px;font-size:20px;font-weight:800;
}
.keypad button.key-enter{grid-row:span 2;background:var(--accent);color:#fff}
.keypad button.key-wide{grid-column:span 2}
.keypad .key-label{
  font-size:11px;color:#8b837d;text-align:center;margin:0 0 7px;
}


.measure-row.active-row{background:#f0ece8;border-radius:10px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
.measure-input.active-input{outline:2px solid #8e847c;outline-offset:2px;border-radius:6px}
.fake-caret{display:inline-block;width:1.5px;height:1.1em;background:#3a3734;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.repeat-button{width:100%;border:0;background:transparent;text-align:left;padding:7px 0;font-size:14px;color:var(--ink)}
.repeat-button.empty{color:#b2aaa4}

</style>
</head>
<body data-build="v0.3.1">
<header><div class="header-row"><div><div class="title">現調</div><div class="tag">職人もデジタル化。</div></div><button id="newSite" class="small-btn">新規</button></div></header>
<main>
<section id="editView" class="edit-view">
<div class="site"><input id="siteName" placeholder="現場名"></div>
<div id="roomTabs" class="tabs"></div>
<div id="roomArea"></div>
</section>
<section id="calcView" class="calc-view">
<div class="calc-card">
<div class="calc-tabs"><button id="byRoom" class="active">部屋別</button><button id="byProduct">品番別</button></div>
<div id="calcContent"></div>
</div>
</section>
</main>


<div id="measureKeypad" class="keypad" aria-hidden="true">
  <div class="key-label" id="keypadLabel">寸法入力</div>
  <div class="keypad-grid">
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key="back">×</button>

    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" data-key="*">※</button>

    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="key-enter" data-key="enter">次へ</button>

    <button type="button" style="visibility:hidden"> </button>
    <button type="button" data-key="0">0</button>
    <button type="button" data-key="-">−</button>
  </div>
</div>
<div class="bottom"><div class="bottom-inner"><button id="editBtn" class="primary">採寸</button><button id="calcBtn">計算</button></div></div>

<div id="roomSheet" class="menu">
 <div class="sheet">
   <h3>部屋を追加</h3>
   <div id="roomChoices" class="choice-grid"></div>
   <input id="customRoom" placeholder="その他の部屋名を入力">
   <div class="sheet-actions">
     <button id="closeRoom" class="cancel">キャンセル</button>
     <button id="addCustomRoom" class="primary2">追加</button>
   </div>
 </div>
</div>

<div id="sectionSheet" class="menu"><div class="sheet"><h3>区分を追加</h3><div id="sectionChoices" class="choice-grid"></div><input id="customSection" placeholder="その他の区分を入力"><div class="sheet-actions"><button id="closeSection" class="cancel">キャンセル</button><button id="addCustomSection" class="primary2">追加</button></div></div></div>
<script>
const KEY="gencho-v03-data",ROOM_NAMES=["玄関","廊下","洗面所","トイレ","洋室1","洋室2","洋室3","和室","キッチン","リビング","LDK","収納","WIC","SC","パントリー","階段","2階廊下"],CATS=["天","ハリ","壁","下り天","AW","CB","腰上","腰下"],$=s=>document.querySelector(s);
let state=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{siteName:"",rooms:[]}}catch{return{siteName:"",rooms:[]}}})(),activeRoom=state.rooms[0]?.id||null,calcMode="room";
let activeMeasureInput=null,activeMeasureModel=null,activeMeasureSection=null,activeMeasureList=null,activeMeasureRow=null,activeRepeatButton=null,activeRepeatSection=null,keypadMode="measure";

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const blank=()=>({id:uid(),value:""});
const newSec=name=>({id:uid(),name,product:"",repeat:"",measures:[blank()]});
const newRoom=name=>({id:uid(),name,sections:[]});


function showMeasureKeypad(inp,model,sec,list,row){
  keypadMode="measure";
  activeRepeatButton=null;activeRepeatSection=null;
  document.querySelectorAll(".measure-row.active-row").forEach(el=>el.classList.remove("active-row"));
  document.querySelectorAll(".measure-input.active-input").forEach(el=>el.classList.remove("active-input"));
  activeMeasureInput=inp;
  activeMeasureModel=model;
  activeMeasureSection=sec;
  activeMeasureList=list;
  activeMeasureRow=row; row?.classList.add("active-row"); inp?.classList.add("active-input");
  $("#keypadLabel").textContent="寸法入力"; const kp=$("#measureKeypad");
  if(kp){kp.classList.add("show");kp.setAttribute("aria-hidden","false")}
}
function showRepeatKeypad(btn,sec){
  keypadMode="repeat";
  activeRepeatButton=btn;activeRepeatSection=sec;
  $("#keypadLabel").textContent="リピート入力";
  const kp=$("#measureKeypad");
  if(kp){kp.classList.add("show");kp.setAttribute("aria-hidden","false")}
}
function hideMeasureKeypad(){
  const kp=$("#measureKeypad");
  if(kp){kp.classList.remove("show");kp.setAttribute("aria-hidden","true")}
}
function syncActiveMeasure(){
  if(!activeMeasureInput||!activeMeasureModel)return;
  activeMeasureModel.value=activeMeasureInput.value
    .replace(/[＊※]/g,"*")
    .replace(/[×xX]/g,"-")
    .replace(/[^\d.*-]/g,"");
  activeMeasureInput.value=activeMeasureModel.value;
  activeMeasureInput.textContent=activeMeasureModel.value || activeMeasureInput.dataset.placeholder || "";
  activeMeasureInput.classList.toggle("empty",!activeMeasureModel.value);
  save(); live();
}
function moveToNextMeasure(){
  if(!activeMeasureSection||!activeMeasureModel||!activeMeasureList)return;
  if(!activeMeasureModel.value.trim())return;

  let currentIndex=activeMeasureSection.measures.findIndex(x=>x.id===activeMeasureModel.id);
  let next=activeMeasureSection.measures[currentIndex+1];

  if(!next){
    next=blank();
    activeMeasureSection.measures.push(next);
    save();
    let nextRow=addMeasureRowGlobal(activeMeasureSection,next,currentIndex+1,activeMeasureList);
    activeMeasureList.appendChild(nextRow);
  }

  const inputs=activeMeasureList.querySelectorAll(".measure-input");
  const nextInput=inputs[currentIndex+1];
  const nextRow=nextInput?.closest(".measure-row");
  if(nextInput && nextRow){
    const nextModel=activeMeasureSection.measures[currentIndex+1];
    showMeasureKeypad(nextInput,nextModel,activeMeasureSection,activeMeasureList,nextRow);
  }
}
function keypadPress(key){
  if(keypadMode==="repeat"){
    if(!activeRepeatButton||!activeRepeatSection)return;
    if(key==="enter"){hideMeasureKeypad();return}
    if(key==="back"){
      activeRepeatSection.repeat=String(activeRepeatSection.repeat||"").slice(0,-1);
    }else if(/^\d$/.test(key)){
      activeRepeatSection.repeat=String(activeRepeatSection.repeat||"")+key;
    }else{
      return;
    }
    activeRepeatButton.textContent=activeRepeatSection.repeat||"リピート";
    activeRepeatButton.classList.toggle("empty",!activeRepeatSection.repeat);
    save();live();return;
  }

  if(!activeMeasureInput||!activeMeasureModel)return;
  if(key==="enter"){moveToNextMeasure();return}
  if(key==="back"){
    if(activeMeasureInput.value.length){
      activeMeasureInput.value=activeMeasureInput.value.slice(0,-1);
      syncActiveMeasure();
    }
    return;
  }
  if(key==="-"){
    if(!activeMeasureInput.value.includes("-") && activeMeasureInput.value.length) activeMeasureInput.value+="-";
  }else if(key==="*"){
    if(activeMeasureInput.value && !activeMeasureInput.value.endsWith("*")) activeMeasureInput.value+="*";
  }else{
    activeMeasureInput.value+=key;
  }
  syncActiveMeasure();
}
function save(){state.siteName=$("#siteName").value.trim();localStorage.setItem(KEY,JSON.stringify(state))}
function room(){return state.rooms.find(r=>r.id===activeRoom)}
function parse(v){let s=String(v||"").trim().replace(/\s/g,"").replace(/[＊※*]/g,"*").replace(/[×xX]/g,"-"),star=s.endsWith("*");if(star)s=s.slice(0,-1);let m=s.match(/^(\d+(?:\.\d+)?)-(\d+)$/);if(!m)return null;let len=+m[1],qty=+m[2];return len>0&&qty>0?{len,qty,star}:null}
function calc(v,rep){let p=parse(v);if(!p)return null;let r=+rep||0,noneCm=p.len*p.qty,each=p.len;if(r>0)each=p.star?p.len+r:Math.ceil(p.len/r)*r;return {...p,r,each,noneM:noneCm/100,withM:each*p.qty/100}}
const fmt=n=>(Math.round((n+Number.EPSILON)*100)/100).toFixed(2)+"m",esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ensure(sec){if(!sec.measures.length)sec.measures.push(blank());if(sec.measures.at(-1).value.trim())sec.measures.push(blank())}
function secTotals(sec){let none=0,withR=0;sec.measures.forEach(m=>{let c=calc(m.value,sec.repeat);if(c){none+=c.noneM;withR+=c.withM}});return{none,withR}}
function roomTotals(r){let none=0,withR=0;r.sections.forEach(s=>{let t=secTotals(s);none+=t.none;withR+=t.withR});return{none,withR}}
function renderTabs(){let w=$("#roomTabs");w.innerHTML="";state.rooms.forEach(r=>{let b=document.createElement("button");b.className="tab"+(r.id===activeRoom?" active":"");b.textContent=r.name;b.onclick=()=>{activeRoom=r.id;render()};w.appendChild(b)});let a=document.createElement("button");a.className="add-tab";a.textContent="+";a.onclick=()=>$("#roomSheet").classList.add("show");w.appendChild(a)}
function renderRoom(){let area=$("#roomArea"),r=room();area.innerHTML="";if(!r){area.innerHTML='<div class="room-card">＋ から部屋を追加してください</div>';return}
let card=document.createElement("div");card.className="room-card";card.innerHTML=`<div class="room-title"><h2>${esc(r.name)}</h2><button class="small-btn" data-r>部屋名編集</button></div><div class="sections"></div><button class="add-section">＋ 区分を追加</button><div class="totals"><div class="total-box"><span>リピートなし</span><strong class="rn"></strong></div><div class="total-box"><span>リピートあり</span><strong class="rw"></strong></div></div>`;
card.querySelector("[data-r]").onclick=()=>{let n=prompt("部屋名を変更",r.name);if(n){r.name=n.trim();save();render()}};
let sw=card.querySelector(".sections");r.sections.forEach(sec=>sw.appendChild(renderSection(r,sec)));card.querySelector(".add-section").onclick=()=>$("#sectionSheet").classList.add("show");
area.appendChild(card);let t=roomTotals(r);card.querySelector(".rn").textContent=fmt(t.none);card.querySelector(".rw").textContent=fmt(t.withR)}

function addMeasureRowGlobal(sec,m,i,list){
  let row=document.createElement("div"),c=calc(m.value,sec.repeat);
  row.className="measure-row";
  const ph=i===0?"238-8":"";
  row.innerHTML=`<button type="button" class="measure-input${m.value?"":" empty"}" value="${esc(m.value)}" data-placeholder="${ph}">${esc(m.value||ph)}</button><div class="line-result">${c?fmt(c.noneM)+" / "+fmt(c.withM):""}</div>`;
  let inp=row.querySelector(".measure-input");
  inp.addEventListener("pointerdown",e=>{e.preventDefault();showMeasureKeypad(inp,m,sec,list,row)});
  inp.addEventListener("focus",()=>{showMeasureKeypad(inp,m,sec,list,row);inp.blur()});
  inp.addEventListener("click",e=>{e.preventDefault();showMeasureKeypad(inp,m,sec,list,row)});
  inp.oninput=()=>{
    m.value=inp.value.replace(/[＊※]/g,"*").replace(/[×xX]/g,"-").replace(/[^\d.*-]/g,"");
    inp.value=m.value;save();live()
  };
  inp.onkeydown=e=>{
    if(e.key==="Enter"){e.preventDefault();showMeasureKeypad(inp,m,sec,list,row);moveToNextMeasure()}
  };
  return row;
}
function renderSection(r,sec){ensure(sec);let d=document.createElement("div");d.className="section";d.innerHTML=`<div class="section-head"><div class="category">${esc(sec.name)}</div><input class="placeholder-input product" placeholder="品番" value="${esc(sec.product)}"><div class="repeat-wrap"><span class="repeat-prefix">↕︎</span><button type="button" class="repeat-button repeat${sec.repeat?"":" empty"}">${sec.repeat?esc(sec.repeat):"リピート"}</button></div><button class="delete-section">×</button></div><div class="measure-list"></div><div class="section-totals"><span>なし <strong class="sn"></strong></span><span>あり <strong class="sw"></strong></span></div>`;
let prod=d.querySelector(".product"),rep=d.querySelector(".repeat");prod.oninput=()=>{sec.product=prod.value;save();live()};rep.onclick=()=>showRepeatKeypad(rep,sec);
d.querySelector(".delete-section").onclick=()=>{if(confirm(sec.name+"を削除しますか？")){r.sections=r.sections.filter(x=>x.id!==sec.id);save();render()}};
let list=d.querySelector(".measure-list");
function addMeasureRow(m,i){
  let row=document.createElement("div"),c=calc(m.value,sec.repeat);
  row.className="measure-row";
  const ph=i===0?"238-8":"";
  row.innerHTML=`<button type="button" class="measure-input${m.value?"":" empty"}" value="${esc(m.value)}" data-placeholder="${ph}">${esc(m.value||ph)}</button><div class="line-result">${c?fmt(c.noneM)+" / "+fmt(c.withM):""}</div>`;
  let inp=row.querySelector(".measure-input");
  inp.addEventListener("pointerdown",e=>{e.preventDefault();showMeasureKeypad(inp,m,sec,list,row)});
  inp.addEventListener("focus",()=>{showMeasureKeypad(inp,m,sec,list,row);inp.blur()});
  inp.addEventListener("click",e=>{e.preventDefault();showMeasureKeypad(inp,m,sec,list,row)});
  inp.oninput=()=>{
    m.value=inp.value.replace(/[＊※]/g,"*").replace(/[×xX]/g,"-").replace(/[^\d.*-]/g,"");
    inp.value=m.value;
    save();
    live()
  };
  inp.onkeydown=e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      if(!m.value.trim())return;

      let currentIndex=sec.measures.findIndex(x=>x.id===m.id);
      let next=sec.measures[currentIndex+1];

      if(!next){
        next=blank();
        sec.measures.push(next);
        save();
        let nextRow=addMeasureRow(next,currentIndex+1);
        list.appendChild(nextRow);
        requestAnimationFrame(()=>{const ni=nextRow.querySelector(".measure-input");showMeasureKeypad(ni,next,sec,list,nextRow)});
      }else{
        let inputs=list.querySelectorAll(".measure-input");
        inputs[currentIndex+1]?.focus({preventScroll:true});
      }
    }else if(e.key==="Backspace"&&!m.value&&sec.measures.length>1){
      e.preventDefault();
      let currentIndex=sec.measures.findIndex(x=>x.id===m.id);
      let prevIndex=Math.max(0,currentIndex-1);
      sec.measures=sec.measures.filter(x=>x.id!==m.id);
      row.remove();
      save();
      live();
      let inputs=list.querySelectorAll(".measure-input");
      inputs[prevIndex]?.focus({preventScroll:true});
    }
  };
  return row;
}
sec.measures.forEach((m,i)=>list.appendChild(addMeasureRow(m,i)));
let t=secTotals(sec);d.querySelector(".sn").textContent=fmt(t.none);d.querySelector(".sw").textContent=fmt(t.withR);return d}
function live(){let r=room(),card=document.querySelector(".room-card");if(!r||!card)return;card.querySelectorAll(".section").forEach((el,i)=>{let s=r.sections[i],t=secTotals(s);el.querySelector(".sn").textContent=fmt(t.none);el.querySelector(".sw").textContent=fmt(t.withR);el.querySelectorAll(".measure-row").forEach((row,j)=>{let c=calc(s.measures[j]?.value,s.repeat);row.querySelector(".line-result").textContent=c?fmt(c.noneM)+" / "+fmt(c.withM):""})});let t=roomTotals(r);card.querySelector(".rn").textContent=fmt(t.none);card.querySelector(".rw").textContent=fmt(t.withR)}
function buildCalc(){let html="";if(calcMode==="room"){state.rooms.forEach(r=>{let rt=roomTotals(r);html+=`<div class="calc-item"><div class="calc-title"><span>${esc(r.name)}</span><span>${fmt(rt.withR)}</span></div>`;r.sections.forEach(s=>{let t=secTotals(s);if(!t.none&&!t.withR)return;html+=`<div class="calc-sub"><b>${esc(s.name)}</b>${s.product?"　"+esc(s.product):""}${s.repeat?"　↕︎"+esc(s.repeat):""}<br>リピートなし ${fmt(t.none)} ／ リピートあり ${fmt(t.withR)}`;let ds=s.measures.map(m=>{let c=calc(m.value,s.repeat);if(!c)return"";let detail=c.r?(c.star?`${c.len}+${c.r}=${c.each}`:`${c.len}→${c.each}`):`${c.len}`;return`${esc(m.value)}　${detail} × ${c.qty} = ${fmt(c.withM)}`}).filter(Boolean);if(ds.length)html+=`<details><summary>計算詳細</summary>${ds.join("<br>")}</details>`;html+="</div>"});html+="</div>"})}else{let g={};state.rooms.forEach(r=>r.sections.forEach(s=>{let k=s.product.trim()||"品番未入力",t=secTotals(s);if(!g[k])g[k]={none:0,withR:0,items:[]};g[k].none+=t.none;g[k].withR+=t.withR;if(t.none||t.withR)g[k].items.push(`${r.name} ${s.name}：${fmt(t.withR)}`)}));Object.entries(g).forEach(([p,x])=>html+=`<div class="calc-item"><div class="calc-title"><span>${esc(p)}</span><span>${fmt(x.withR)}</span></div><div class="calc-sub">${x.items.map(esc).join("<br>")}<br><b>リピートなし ${fmt(x.none)} ／ リピートあり ${fmt(x.withR)}</b></div></div>`)}
let gn=0,gw=0;state.rooms.forEach(r=>{let t=roomTotals(r);gn+=t.none;gw+=t.withR});html+=`<div class="calc-item"><div>現場合計</div><div class="grand">リピートあり ${fmt(gw)}</div><div class="calc-sub">リピートなし ${fmt(gn)}</div></div>`;$("#calcContent").innerHTML=html}
function render(){ $("#siteName").value=state.siteName||"";renderTabs();renderRoom();buildCalc()}

ROOM_NAMES.forEach(name=>{
  let b=document.createElement("button");b.className="choice";b.textContent=name;
  b.onclick=()=>{
    let r=newRoom(name);state.rooms.push(r);activeRoom=r.id;save();
    $("#roomSheet").classList.remove("show");render();
  };
  $("#roomChoices").appendChild(b);
});
$("#closeRoom").onclick=()=>$("#roomSheet").classList.remove("show");
$("#addCustomRoom").onclick=()=>{
  let n=$("#customRoom").value.trim();
  if(n){
    let r=newRoom(n);state.rooms.push(r);activeRoom=r.id;
    $("#customRoom").value="";save();$("#roomSheet").classList.remove("show");render();
  }
};

CATS.forEach(name=>{let b=document.createElement("button");b.className="choice";b.textContent=name;b.onclick=()=>{let r=room();if(r){r.sections.push(newSec(name));save();$("#sectionSheet").classList.remove("show");render()}};$("#sectionChoices").appendChild(b)});
$("#closeSection").onclick=()=>$("#sectionSheet").classList.remove("show");$("#addCustomSection").onclick=()=>{let n=$("#customSection").value.trim(),r=room();if(n&&r){r.sections.push(newSec(n));$("#customSection").value="";save();$("#sectionSheet").classList.remove("show");render()}};
$("#siteName").oninput=save;$("#editBtn").onclick=()=>{$("#calcView").classList.remove("active");$("#editView").classList.remove("hidden");$("#editBtn").classList.add("primary");$("#calcBtn").classList.remove("primary")};
$("#calcBtn").onclick=()=>{save();buildCalc();$("#editView").classList.add("hidden");$("#calcView").classList.add("active");$("#calcBtn").classList.add("primary");$("#editBtn").classList.remove("primary")};
$("#byRoom").onclick=()=>{calcMode="room";$("#byRoom").classList.add("active");$("#byProduct").classList.remove("active");buildCalc()};$("#byProduct").onclick=()=>{calcMode="product";$("#byProduct").classList.add("active");$("#byRoom").classList.remove("active");buildCalc()};
$("#newSite").onclick=()=>{if(confirm("現在の現場を消して新規作成しますか？")){state={siteName:"",rooms:[]};activeRoom=null;save();render()}};


$("#measureKeypad").querySelectorAll("button[data-key]").forEach(btn=>{
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keypadPress(btn.dataset.key);
  });
});
document.addEventListener("pointerdown",e=>{
  const kp=$("#measureKeypad");
  if(!kp)return;
  if(kp.contains(e.target) || e.target.classList?.contains("measure-input"))return;
  if(e.target.closest?.(".bottom"))return;
  hideMeasureKeypad();
});

render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>

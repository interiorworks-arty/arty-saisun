<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f8176"><link rel="manifest" href="manifest.webmanifest"><title>ARTY 採寸</title><style>:root{--bg:#f4f1ed;--card:#fff;--ink:#2f2b28;--sub:#7f746c;--line:#d8d0ca;--accent:#8f8176}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:rgba(244,241,237,.96);padding:14px 16px;border-bottom:1px solid var(--line)}header h1{font-size:20px;margin:0}main{max-width:900px;margin:auto;padding:16px 16px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}label{font-size:13px;color:var(--sub);display:block;margin:8px 0 5px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#e9e3de;color:var(--ink)}button.danger{background:#b85c5c}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px}.measure{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}.result{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}.total{font-size:22px;font-weight:800}.room-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eee8e3;color:#5f554e;font-size:12px}.hidden{display:none}.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.sticky button{flex:1}.summary-room{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px}@media(max-width:620px){.row,.row3{grid-template-columns:1fr}.toolbar button{min-width:0}}</style></head><body><header><h1>ARTY 採寸</h1></header><main><section id="editView"><div class="card"><label>現場名</label><input id="siteName" placeholder="例：○○マンション 101号室"></div><div id="rooms"></div><div class="toolbar"><button id="addRoom">＋ 部屋を追加</button><button class="secondary" id="showSummary">集計を見る</button></div></section><section id="summaryView" class="hidden"><div class="card"><div class="room-title"><h2 style="margin:0">集計</h2><button class="secondary" id="backEdit">編集に戻る</button></div><p id="summarySite"></p><div id="summaryBody"></div><div class="total" id="grandTotal"></div><div class="toolbar" style="margin-top:14px"><button id="shareLine">共有する</button><button class="secondary" id="copyText">本文をコピー</button></div></div></section></main><div class="sticky"><button class="secondary" id="saveBtn">保存</button><button id="summaryBtn">集計</button></div><template id="roomTpl"><div class="card room"><div class="room-title"><input class="roomName" placeholder="部屋名（例：洋室）" style="font-weight:700"><button class="danger deleteRoom">削除</button></div><div class="measures"></div><button class="secondary addMeasure" style="margin-top:12px;width:100%">＋ 採寸を追加</button></div></template><template id="measureTpl"><div class="measure"><div class="row3"><div><label>区分</label><select class="category"><option>天</option><option>壁</option><option>梁</option><option>下り天</option><option>AW</option><option>腰上</option><option>腰下</option></select></div><div><label>材料品番</label><input class="material" placeholder="例：SP-9701"></div><div><label>リピート（cm）</label><input class="repeat" inputmode="decimal" placeholder="例：64"></div></div><div class="row"><div><label>採寸（cm-本数）</label><input class="notation" placeholder="例：238-8"></div><div><label>1柄伸ばし</label><select class="extra"><option value="0">なし</option><option value="1">＊あり</option></select></div></div><div class="result"></div><button class="danger deleteMeasure" style="margin-top:8px">この行を削除</button></div></template><script>const $=s=>document.querySelector(s),roomsEl=$("#rooms");function calc(n,r,e){const m=String(n||"").trim().match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+)$/);if(!m)return null;const l=Number(m[1]),q=Number(m[2]),rp=Number(r)||0;const off=l*q/100;let on=off,a=l;if(rp>0){a=Math.ceil(l/rp)*rp+(e?rp:0);on=a*q/100}return{off,on,a}}function updateResult(m){const c=calc(m.querySelector('.notation').value,m.querySelector('.repeat').value,m.querySelector('.extra').value==='1');m.querySelector('.result').textContent=c?`リピートOFF：${c.off.toFixed(1)}m ／ リピートON：${c.on.toFixed(1)}m（1本 ${c.a}cm）`:'「238-8」の形で入力'}function addMeasure(room,d={}){const el=$("#measureTpl").content.firstElementChild.cloneNode(true);el.querySelector('.category').value=d.category||'天';el.querySelector('.material').value=d.material||'';el.querySelector('.repeat').value=d.repeat||'';el.querySelector('.notation').value=d.notation||'';el.querySelector('.extra').value=d.extra?'1':'0';el.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',()=>updateResult(el)));el.querySelector('.deleteMeasure').onclick=()=>{el.remove();save()};room.querySelector('.measures').appendChild(el);updateResult(el)}function addRoom(d={}){const room=$("#roomTpl").content.firstElementChild.cloneNode(true);room.querySelector('.roomName').value=d.name||'';room.querySelector('.addMeasure').onclick=()=>addMeasure(room);room.querySelector('.deleteRoom').onclick=()=>{room.remove();save()};roomsEl.appendChild(room);(d.measures&&d.measures.length?d.measures:[{}]).forEach(x=>addMeasure(room,x))}function getData(){return{site:$("#siteName").value,rooms:[...document.querySelectorAll('.room')].map(r=>({name:r.querySelector('.roomName').value,measures:[...r.querySelectorAll('.measure')].map(m=>({category:m.querySelector('.category').value,material:m.querySelector('.material').value,repeat:m.querySelector('.repeat').value,notation:m.querySelector('.notation').value,extra:m.querySelector('.extra').value==='1'}))}))}}function save(){localStorage.setItem('artySaisun',JSON.stringify(getData()))}function load(){const d=JSON.parse(localStorage.getItem('artySaisun')||'null');if(d){$("#siteName").value=d.site||'';(d.rooms||[]).forEach(addRoom)}else addRoom()}function buildSummary(){const d=getData();$("#summarySite").textContent=`現場名：${d.site||'未入力'}`;let go=0,gn=0,txt=`【ARTY 採寸】\n現場名：${d.site||'未入力'}\n`;$("#summaryBody").innerHTML='';d.rooms.forEach((r,i)=>{let o=0,n=0,html=`<div class="summary-room"><b>${r.name||`部屋${i+1}`}</b>`;txt+=`\n■ ${r.name||`部屋${i+1}`}\n`;r.measures.forEach(x=>{const c=calc(x.notation,x.repeat,x.extra);if(!c)return;o+=c.off;n+=c.on;html+=`<div>${x.category}｜${x.material||'品番なし'}｜${x.notation}${x.repeat?`｜↕︎${x.repeat}`:''}${x.extra?'｜＊':''}<br><span class="pill">OFF ${c.off.toFixed(1)}m</span> <span class="pill">ON ${c.on.toFixed(1)}m</span></div>`;txt+=`${x.category} ${x.material||''} ${x.notation}${x.repeat?` ↕︎${x.repeat}`:''}${x.extra?' ＊':''}／OFF ${c.off.toFixed(1)}m・ON ${c.on.toFixed(1)}m\n`});html+=`<hr>小計：OFF ${o.toFixed(1)}m ／ ON ${n.toFixed(1)}m</div>`;txt+=`小計：OFF ${o.toFixed(1)}m／ON ${n.toFixed(1)}m\n`;$("#summaryBody").insertAdjacentHTML('beforeend',html);go+=o;gn+=n});$("#grandTotal").textContent=`合計：OFF ${go.toFixed(1)}m ／ ON ${gn.toFixed(1)}m`;return txt+`\n合計：OFF ${go.toFixed(1)}m／ON ${gn.toFixed(1)}m`}function showSummary(){save();$("#editView").classList.add('hidden');$("#summaryView").classList.remove('hidden');buildSummary();scrollTo(0,0)}$("#addRoom").onclick=()=>addRoom();$("#showSummary").onclick=showSummary;$("#summaryBtn").onclick=showSummary;$("#backEdit").onclick=()=>{$("#summaryView").classList.add('hidden');$("#editView").classList.remove('hidden')};$("#saveBtn").onclick=()=>{save();alert('保存しました')};$("#copyText").onclick=async()=>{await navigator.clipboard.writeText(buildSummary());alert('コピーしました')};$("#shareLine").onclick=async()=>{const text=buildSummary();if(navigator.share)await navigator.share({title:'ARTY 採寸',text});else location.href='https://line.me/R/msg/text/?'+encodeURIComponent(text)};window.addEventListener('beforeunload',save);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
